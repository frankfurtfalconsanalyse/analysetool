<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Taktikboard · Falcons Analyse-Hub</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/rink.js"></script>
    <style>
        body { overflow: hidden; }
        .board { display: flex; height: calc(100vh - var(--header-h)); height: calc(100dvh - var(--header-h)); }
        .tools { width: 64px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 0; background: var(--surface); border-right: 1px solid var(--border); }
        .tool { width: 42px; height: 42px; border-radius: var(--radius); display: grid; place-items: center; cursor: pointer; color: var(--text-muted); border: 1px solid transparent; background: none; }
        .tool:hover { background: var(--surface-2); color: var(--text); }
        .tool.active { background: var(--brand-soft); color: #ff5a63; border-color: rgba(227,6,19,.4); }
        .tools .sep { width: 28px; height: 1px; background: var(--border); margin: 4px 0; }
        .swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: inset 0 0 0 2px rgba(0,0,0,.3); }
        .swatch.active { border-color: #fff; }
        .rink-stage { flex: 1; min-width: 0; }
        .rink { touch-action: none; }
        .rink.mode-move .piece { cursor: grab; }

        .panel { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); }
        .panel-section { padding: 16px; border-bottom: 1px solid var(--border); }
        .panel-title { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text-faint); margin-bottom: 12px; }
        .bench { display: flex; gap: 10px; }
        .bench-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); cursor: grab; font-size: 11px; color: var(--text-muted); touch-action: none; user-select: none; -webkit-user-select: none; }
        .bench-item:hover { border-color: var(--border-strong); }
        .bench-item .piece { position: static; pointer-events: none; width: 30px; height: 30px; font-size: 12px; }
        .bench-item .piece-ball { width: 16px; height: 16px; margin: 7px 0; }
        .saved { flex: 1; overflow-y: auto; padding: 16px; }
        .trash { margin: 0 16px 12px; height: 48px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-faint); font-size: 12px; transition: .15s; }
        .trash.hover { border-color: var(--brand); color: #ff5a63; background: var(--brand-soft); }
        .save-box { padding: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }

        @media (max-width: 860px) {
            body { overflow: auto; }
            .board { flex-direction: column; height: auto; }
            .tools { width: 100%; flex-direction: row; justify-content: center; padding: 8px; border-right: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
            .tools .sep { width: 1px; height: 28px; margin: 0 4px; }
            .rink-stage { height: 56vw; min-height: 220px; flex: none; }
            .panel { width: 100%; border-left: 0; border-top: 1px solid var(--border); }
        }
    </style>
</head>
<body>

<div class="board" id="board">
    <div class="tools" id="tools">
        <button class="tool active" id="tool-move" title="Figuren bewegen" onclick="setMode('move')"></button>
        <button class="tool" id="tool-draw" title="Zeichnen" onclick="setMode('draw')"></button>
        <button class="tool" id="tool-undo" title="Rückgängig" onclick="undo()"></button>
        <button class="tool" id="tool-clear" title="Board leeren" onclick="clearBoard()"></button>
        <div class="sep"></div>
        <div class="swatch active" style="background:#e30613" data-color="#e30613"></div>
        <div class="swatch" style="background:#1d6fe0" data-color="#1d6fe0"></div>
        <div class="swatch" style="background:#111111" data-color="#111111"></div>
    </div>

    <div class="rink-stage" id="stage">
        <div class="rink mode-move" id="rink"><canvas id="canvas" width="960" height="560"></canvas><div class="pieces" id="pieces"></div></div>
    </div>

    <aside class="panel">
        <div class="panel-section">
            <div class="panel-title">Figur aufs Feld ziehen</div>
            <div class="bench">
                <div class="bench-item" data-type="falcons"><div class="piece piece-falcons">F</div>Falcons</div>
                <div class="bench-item" data-type="opponent"><div class="piece piece-opponent">G</div>Gegner</div>
                <div class="bench-item" data-type="ball"><div class="piece piece-ball"></div>Ball</div>
            </div>
        </div>
        <div class="saved">
            <div class="panel-title">Gespeicherte Boards</div>
            <div id="saved-list"></div>
        </div>
        <div class="trash" id="trash"></div>
        <div class="save-box">
            <input id="t-name" class="input" placeholder="Titel, z. B. Breakout links">
            <button class="btn btn-primary" onclick="saveTactic()" id="btn-save"></button>
        </div>
    </aside>
</div>

<script>
    const F = Falcons, I = F.icon, $ = id => document.getElementById(id);
    F.requireUser();
    F.mountShell('tactic', { bottomNav: false });
    F.isAdmin().then(a => { if (!a) { document.getElementById('board').innerHTML = `<div class="page">${F.empty('Kein Zugriff', 'Das Taktikboard ist nur für Trainer verfügbar.', 'lock')}</div>`; } });

    const rink = $('rink'), canvas = $('canvas'), ctx = canvas.getContext('2d'), trash = $('trash');
    let scale = 1, mode = 'move', pen = '#e30613', history = [], drag = null, drawing = false, activeId = null;

    rink.insertAdjacentHTML('afterbegin', Rink.markup());
    $('tool-move').innerHTML = I('move'); $('tool-draw').innerHTML = I('pen'); $('tool-undo').innerHTML = I('undo'); $('tool-clear').innerHTML = I('trash');
    trash.innerHTML = I('trash', 'icon-sm') + ' Hierher ziehen zum Entfernen';
    $('btn-save').innerHTML = I('save', 'icon-sm') + ' Als neues Board speichern';

    function fit() { scale = Rink.fit($('stage'), rink); }
    window.addEventListener('resize', fit);
    fit();

    /** Bildschirm-Koordinaten → Feld-Koordinaten (berücksichtigt Skalierung) */
    function toRink(e) {
        const r = rink.getBoundingClientRect();
        return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
    }
    const overTrash = e => { const t = trash.getBoundingClientRect(); return e.clientX > t.left && e.clientX < t.right && e.clientY > t.top && e.clientY < t.bottom; };

    /* -------------------------------------------------------- Modus & Farbe */
    function setMode(m) {
        mode = m;
        $('tool-move').classList.toggle('active', m === 'move');
        $('tool-draw').classList.toggle('active', m === 'draw');
        canvas.classList.toggle('active', m === 'draw');
        rink.classList.toggle('mode-move', m === 'move');
        $('pieces').style.pointerEvents = 'none';
        document.querySelectorAll('#pieces .piece').forEach(p => p.style.pointerEvents = m === 'move' ? 'auto' : 'none');
    }
    document.querySelectorAll('.swatch').forEach(s => s.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
        s.classList.add('active'); pen = s.dataset.color; setMode('draw');
    }));

    /* ------------------------------------------------------ Figuren ziehen */
    function startDrag(el, e, offset) {
        drag = { el, offset };
        el.style.pointerEvents = 'none';
        e.preventDefault();
    }
    $('pieces').addEventListener('pointerdown', e => {
        const el = e.target.closest('.piece');
        if (!el || mode !== 'move') return;
        const p = toRink(e);
        startDrag(el, e, { x: p.x - el.offsetLeft, y: p.y - el.offsetTop });
    });
    document.querySelectorAll('.bench-item').forEach(b => b.addEventListener('pointerdown', e => {
        setMode('move');
        const el = Rink.createPiece(b.dataset.type, '0px', '0px');
        $('pieces').appendChild(el);
        const half = b.dataset.type === 'ball' ? 9 : 18;
        startDrag(el, e, { x: half, y: half });
        moveDrag(e);
    }));
    function moveDrag(e) {
        if (!drag) return;
        const p = toRink(e);
        drag.el.style.left = Math.round(p.x - drag.offset.x) + 'px';
        drag.el.style.top = Math.round(p.y - drag.offset.y) + 'px';
        trash.classList.toggle('hover', overTrash(e));
    }
    function endDrag(e) {
        if (!drag) return;
        const el = drag.el;
        if (overTrash(e)) el.remove();
        else {
            // im Feld halten
            el.style.left = Math.max(0, Math.min(Rink.W - el.offsetWidth, el.offsetLeft)) + 'px';
            el.style.top = Math.max(0, Math.min(Rink.H - el.offsetHeight, el.offsetTop)) + 'px';
            el.style.pointerEvents = 'auto';
        }
        drag = null; trash.classList.remove('hover');
    }
    document.addEventListener('pointermove', moveDrag);
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);

    /* ------------------------------------------------------------ Zeichnen */
    function saveState() { history.push(canvas.toDataURL()); if (history.length > 30) history.shift(); }
    canvas.addEventListener('pointerdown', e => {
        if (mode !== 'draw') return;
        e.preventDefault(); saveState(); drawing = true;
        canvas.setPointerCapture(e.pointerId);
        const p = toRink(e);
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
        ctx.strokeStyle = pen; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    });
    canvas.addEventListener('pointermove', e => { if (!drawing) return; const p = toRink(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    canvas.addEventListener('pointerup', () => drawing = false);
    canvas.addEventListener('pointercancel', () => drawing = false);

    function undo() {
        const prev = history.pop(); if (!prev) return;
        const img = new Image(); img.onload = () => { ctx.clearRect(0, 0, Rink.W, Rink.H); ctx.drawImage(img, 0, 0); }; img.src = prev;
    }
    function clearBoard() {
        if (!confirm('Board leeren?')) return;
        saveState(); ctx.clearRect(0, 0, Rink.W, Rink.H); $('pieces').innerHTML = '';
        activeId = null; renderActive();
    }

    /* ------------------------------------------------------ Speichern/Laden */
    async function saveTactic() {
        const title = $('t-name').value.trim();
        if (!title) return F.toast('Bitte einen Titel eingeben', 'error');
        const players = [...$('pieces').children].map(p => ({ type: p.dataset.type, x: p.style.left, y: p.style.top }));
        const ref = await db.collection('tactics').add({ title, players, drawing: canvas.toDataURL(), createdAt: new Date() });
        $('t-name').value = ''; activeId = ref.id;
        F.toast('Board gespeichert');
        loadList();
    }

    async function loadList() {
        const snap = await db.collection('tactics').orderBy('createdAt', 'desc').get();
        $('saved-list').innerHTML = snap.size ? snap.docs.map(d => `
            <div class="list-item" data-id="${d.id}" onclick="loadTactic('${d.id}')">
                ${I('clipboard', 'icon-sm')}<span class="title">${F.esc(d.data().title)}</span>
                <button class="btn btn-ghost btn-icon btn-sm btn-danger del" onclick="event.stopPropagation(); deleteTactic('${d.id}')">${I('trash', 'icon-sm')}</button>
            </div>`).join('') : '<p class="faint" style="font-size:13px">Noch keine Boards gespeichert.</p>';
        renderActive();
    }
    function renderActive() { document.querySelectorAll('#saved-list .list-item').forEach(el => el.classList.toggle('active', el.dataset.id === activeId)); }

    async function loadTactic(id) {
        const doc = await db.collection('tactics').doc(id).get();
        const d = doc.data();
        Rink.render(rink, canvas, d);
        history = []; activeId = id; renderActive();
        setMode(mode);
    }
    async function deleteTactic(id) { if (await F.deleteDoc('tactics', id, 'Board löschen?')) loadList(); }

    loadList();
</script>
</body>
</html>
