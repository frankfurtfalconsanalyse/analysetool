<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clip-Analyse · Falcons Analyse-Hub</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
        // Fängt Ladefehler ab (z. B. veraltete Dateien im Browser-Cache) statt einen leeren Bildschirm zu zeigen
        window.addEventListener('error', function (e) { showLoadError(e.message); });
        window.addEventListener('unhandledrejection', function (e) { showLoadError(e.reason && (e.reason.message || e.reason)); });
        function showLoadError(msg) {
            if (document.getElementById('load-error')) return;
            var go = function () {
                var d = document.createElement('div'); d.id = 'load-error';
                d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;max-width:calc(100% - 32px);background:#22262c;border:1px solid #e30613;color:#eceef1;padding:14px 16px;border-radius:12px;font:14px system-ui,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;gap:12px;align-items:center;flex-wrap:wrap';
                d.innerHTML = '<span>Es ist ein Fehler aufgetreten. Bitte neu laden.<br><small style="color:#9aa1ac">' + String(msg || '').replace(/</g, '&lt;').slice(0, 160) + '</small></span>';
                var b = document.createElement('button'); b.textContent = 'Neu laden';
                b.style.cssText = 'background:#e30613;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer';
                b.onclick = function () { location.reload(); }; d.appendChild(b); document.body.appendChild(d);
            };
            document.body ? go() : document.addEventListener('DOMContentLoaded', go);
        }
    </script>
    <link rel="stylesheet" href="assets/css/app.css?v=20261108g">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/config.js?v=20261108g"></script>
    <script src="assets/js/core.js?v=20261108g"></script>
    <script src="assets/js/player.js?v=20261108g"></script>
    <style>
        #draw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; touch-action: none; }
        #draw-canvas.active { pointer-events: auto; cursor: crosshair; }
        .drawing-hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 11; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.15); pointer-events: none; }
        .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); }
        .swatch.active { border-color: #fff; }
        #btn-draw.active { background: var(--brand); border-color: var(--brand); color: #fff; }
        .viewing { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--info); white-space: nowrap; }
        .viewing button { height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--border-strong); background: none; color: var(--text-muted); cursor: pointer; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>

<div class="workspace">
    <div class="workspace-main">
        <div class="workspace-stage" id="stage">
            <canvas id="draw-canvas"></canvas>
            <div class="drawing-hint hidden" id="draw-hint">Aufs Video zeichnen – dann „Zeichnung speichern“ oder „Fertig“</div>
        </div>
        <div class="stage-bar">
            <button class="btn btn-sm" id="btn-draw" onclick="toggleDrawing()"></button>
            <span class="sep"></span>
            <div class="swatch active" style="background:#e30613" data-color="#e30613"></div>
            <div class="swatch" style="background:#ffd400" data-color="#ffd400"></div>
            <div class="swatch" style="background:#22d3ee" data-color="#22d3ee"></div>
            <div class="swatch" style="background:#ffffff" data-color="#ffffff"></div>
            <span class="sep"></span>
            <button class="btn btn-sm btn-ghost" id="btn-undo" onclick="undo()" title="Rückgängig"></button>
            <button class="btn btn-sm btn-ghost" id="btn-clear" onclick="clearDraw()" title="Zeichnung löschen"></button>
            <span class="sep"></span>
            <button class="btn btn-sm btn-primary hidden" id="btn-save-drawing" onclick="saveDrawing()" title="Zeichnung mit Text als Kommentar speichern"></button>
            <span class="viewing hidden" id="viewing"></span>
        </div>
    </div>

    <aside class="workspace-side">
        <div class="side-head">
            <a href="index.html" class="crumb" id="crumb">Dashboard</a>
            <h1 id="title">Clip-Analyse</h1>
            <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap" id="badges"></div>
        </div>
        <div class="side-scroll"><div class="feed" id="comments"></div></div>
        <div class="composer">
            <textarea id="com-input" class="textarea" placeholder="Feedback schreiben … (@Nr markiert)"></textarea>
            <button class="btn btn-primary btn-icon" id="send-btn" onclick="sendComment()" title="Senden"></button>
        </div>
    </aside>
</div>

<script>
    const F = Falcons, I = F.icon, $ = id => document.getElementById(id);
    const user = F.requireUser();
    F.mountShell('dashboard', { bottomNav: false });

    const params = new URLSearchParams(location.search);
    const videoId = params.get('id'), type = params.get('type') || 'drive';
    let players = {}, admin = false, clip = null, commentDocs = [], pendingDrawing = params.get('c');

    $('crumb').innerHTML = I('arrowLeft', 'icon-sm') + ' Dashboard';
    $('btn-undo').innerHTML = I('undo', 'icon-sm');
    $('btn-clear').innerHTML = I('trash', 'icon-sm');
    $('btn-save-drawing').innerHTML = I('save', 'icon-sm') + ' Zeichnung speichern';
    $('send-btn').innerHTML = I('send');
    F.submitOnEnter($('com-input'), sendComment);
    F.onTimestamp = jumpTo;

    async function init() {
        if (!videoId) return location.replace('index.html');
        const [pSnap, isAdm, media] = await Promise.all([F.T('players').get(), F.isAdmin(), F.loadMedia()]);
        players = F.playerMap(pSnap); admin = isAdm;

        clip = media.find(m => m.id === videoId) || (type === 'drive'
            ? { id: videoId, type: 'drive', title: 'Clip', embedUrl: `https://drive.google.com/file/d/${videoId}/preview` }
            : null);
        if (!clip) { $('comments').innerHTML = F.empty('Clip nicht gefunden', '', 'video'); return; }

        await mediaView.show(clip);
        mediaView.overlay.appendChild($('draw-canvas'));   // Zeichenfläche liegt über dem Video, nicht über der Steuerleiste
        mediaView.overlay.appendChild($('draw-hint'));
        $('title').textContent = clip.title;
        document.title = `${clip.title} · Falcons Analyse-Hub`;
        $('badges').innerHTML = [clip.category, clip.position !== 'Alle' && clip.position, clip.type === 'youtube' ? 'YouTube' : 'Drive']
            .filter(Boolean).map(b => `<span class="badge">${F.esc(b)}</span>`).join('');
        F.markViewed('video_views', videoId);
        listen();
    }

    function listen() {
        $('comments').innerHTML = F.loading();
        F.T('comments').where('videoId', '==', videoId).onSnapshot(snap => {
            const docs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => F.parseTime(a.text) - F.parseTime(b.text));
            commentDocs = docs;
            if (pendingDrawing && docs.some(d => d.id === pendingDrawing)) { const id = pendingDrawing; pendingDrawing = null; setTimeout(() => showDrawing(id), 400); }
            $('comments').innerHTML = docs.length
                ? F.threadHtml(docs, { me: user.nr, admin, onRead: 'F.toggleRead', onDelete: 'deleteComment', onReply: 'sendReply' })
                : F.empty('Noch kein Feedback', 'Schreib den ersten Kommentar zu diesem Clip.', 'message');
        });
    }

    async function sendComment() {
        const input = $('com-input'), raw = input.value.trim();
        if (!raw) return;
        const { text, mentions } = F.resolveMentions(raw, players);
        await F.T('comments').add({ videoId, text, author: user.name, authorNr: user.nr, mentions, readBy: [], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        input.value = '';
    }
    function deleteComment(id) { F.deleteDoc('comments', id, 'Kommentar löschen?'); }
    /** Antwort auf einen Kommentar (gleicher Clip, parentId = Kommentar) */
    async function sendReply(parentId, raw) {
        const { text, mentions } = F.resolveMentions(raw, players);
        await F.T('comments').add({ videoId: videoId, parentId, text, author: user.name, authorNr: user.nr, mentions, readBy: [], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }

    const mediaView = new FalconsPlayer.Media($('stage'));
    function jumpTo(sec) {
        if (!mediaView.seek(sec)) F.toast('Springen ist nur bei YouTube-Clips möglich', 'error');
    }

    /* ------------------------------------------------------------ Zeichnen */
    // Striche werden als Vektoren gespeichert (Koordinaten 0…1 relativ zum Video),
    // so passen gespeicherte Zeichnungen auf jede Bildschirmgröße.
    const canvas = $('draw-canvas'), ctx = canvas.getContext('2d');
    let drawing = false, pen = '#e30613', strokes = [], current = null, history = [], viewingId = null;

    function sizeCanvas() {
        const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
        redraw();
    }
    function redraw(list = strokes) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const w = canvas.width, h = canvas.height, lw = Math.max(3, w / 320);
        [...list, ...(current ? [current] : [])].forEach(st => {
            const p = st.points; if (p.length < 2) return;
            ctx.beginPath(); ctx.strokeStyle = st.color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.moveTo(p[0] * w, p[1] * h);
            for (let i = 2; i + 1 < p.length; i += 2) ctx.lineTo(p[i] * w, p[i + 1] * h);
            if (p.length === 2) ctx.lineTo(p[0] * w + 0.1, p[1] * h);
            ctx.stroke();
        });
        $('btn-save-drawing').classList.toggle('hidden', !strokes.length || viewingId !== null);
    }
    function setDrawBtn() { $('btn-draw').innerHTML = drawing ? I('check', 'icon-sm') + ' Fertig' : I('pen', 'icon-sm') + ' Zeichnen'; }
    function toggleDrawing() {
        if (viewingId) closeDrawing();
        drawing = !drawing;
        canvas.classList.toggle('active', drawing);
        $('btn-draw').classList.toggle('active', drawing);
        $('draw-hint').classList.toggle('hidden', !drawing);
        if (drawing) { mediaView.pause(); sizeCanvas(); }
        setDrawBtn();
    }
    function clearDraw() { if (viewingId) return closeDrawing(); if (!strokes.length) return; history.push(strokes.slice()); strokes = []; redraw(); }
    function undo() { if (!history.length) return; strokes = history.pop(); redraw(); }
    document.querySelectorAll('.swatch').forEach(s => s.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
        s.classList.add('active'); pen = s.dataset.color;
    }));

    function pos(e) {
        const r = canvas.getBoundingClientRect();
        return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
    }
    canvas.addEventListener('pointerdown', e => {
        if (!drawing) return; e.preventDefault(); canvas.setPointerCapture(e.pointerId);
        history.push(strokes.slice()); if (history.length > 40) history.shift();
        current = { color: pen, points: pos(e) };
    });
    canvas.addEventListener('pointermove', e => {
        if (!current) return;
        const [x, y] = pos(e), p = current.points;
        if (Math.hypot(x - p[p.length - 2], y - p[p.length - 1]) > 0.002) { p.push(x, y); redraw(); }
    });
    const endStroke = () => { if (!current) return; strokes.push({ color: current.color, points: current.points.map(v => Math.round(v * 1000) / 1000) }); current = null; redraw(); };
    canvas.addEventListener('pointerup', endStroke); canvas.addEventListener('pointercancel', endStroke);
    window.addEventListener('resize', () => { if (canvas.width > 1) sizeCanvas(); });

    /** Zeichnung + Text als Kommentar speichern (Text aus dem Kommentarfeld) */
    async function saveDrawing() {
        if (!strokes.length) return;
        let raw = $('com-input').value.trim();
        if (!raw) raw = (prompt('Kurzer Text zur Zeichnung (z. B. „Hier musst du dich anbieten“):', '') || '').trim();
        if (!raw) return F.toast('Bitte einen Text zur Zeichnung eingeben', 'error');
        const sec = Math.floor(mediaView.time());
        if (mediaView.isYouTube && !F.hasTime(raw)) raw = `${F.fmtTime(sec)} ${raw}`;
        const { text, mentions } = F.resolveMentions(raw, players);
        const r = canvas.getBoundingClientRect();
        const data = { videoId, text, author: user.name, authorNr: user.nr, mentions, readBy: [], createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            drawing: { strokes, aspect: Math.round(r.width / r.height * 1000) / 1000 } };
        if (mediaView.isYouTube) data.drawingTime = sec;
        await F.T('comments').add(data);
        $('com-input').value = ''; strokes = []; history = []; redraw();
        if (drawing) toggleDrawing();
        F.toast('Zeichnung gespeichert');
    }

    /** Gespeicherte Zeichnung anzeigen: an die Stelle springen, anhalten, Zeichnung einblenden */
    function showDrawing(id) {
        const c = commentDocs.find(x => x.id === id); if (!c || !c.drawing) return;
        if (drawing) toggleDrawing();
        viewingId = id;
        if (c.drawingTime !== undefined && mediaView.isYouTube) { mediaView.player.seek(c.drawingTime, { play: false }); mediaView.pause(); }
        sizeCanvas(); redraw(c.drawing.strokes || []);
        $('viewing').innerHTML = `${I('pen', 'icon-sm')} Zeichnung von ${F.esc(c.author || '')} <button onclick="closeDrawing()">Ausblenden</button>`;
        $('viewing').classList.remove('hidden');
        document.querySelectorAll('.comment').forEach(el => el.classList.toggle('highlight', el.dataset.id === id));
    }
    function closeDrawing() {
        viewingId = null; $('viewing').classList.add('hidden'); redraw();
        document.querySelectorAll('.comment.highlight').forEach(el => el.classList.remove('highlight'));
    }
    F.onDrawing = showDrawing;

    setDrawBtn();
    F.ready.then(init);
</script>
</body>
</html>
