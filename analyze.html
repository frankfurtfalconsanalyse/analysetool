<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clip-Analyse · Falcons Analyse-Hub</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
        // Fängt Ladefehler ab (z. B. veraltete Dateien im Browser-Cache) statt einen leeren Bildschirm zu zeigen
        window.addEventListener('error', function (e) { showLoadError(e.message); });
        window.addEventListener('unhandledrejection', function (e) { showLoadError(e.reason && (e.reason.message || e.reason)); });
        function showLoadError(msg) {
            if (document.getElementById('load-error')) return;
            var go = function () {
                var d = document.createElement('div'); d.id = 'load-error';
                d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;max-width:calc(100% - 32px);background:#22262c;border:1px solid #e30613;color:#eceef1;padding:14px 16px;border-radius:12px;font:14px system-ui,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;gap:12px;align-items:center;flex-wrap:wrap';
                d.innerHTML = '<span>Es ist ein Fehler aufgetreten. Bitte neu laden.<br><small style="color:#9aa1ac">' + String(msg || '').replace(/</g, '&lt;').slice(0, 160) + '</small></span>';
                var b = document.createElement('button'); b.textContent = 'Neu laden';
                b.style.cssText = 'background:#e30613;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer';
                b.onclick = function () { location.reload(); }; d.appendChild(b); document.body.appendChild(d);
            };
            document.body ? go() : document.addEventListener('DOMContentLoaded', go);
        }
    </script>
    <link rel="stylesheet" href="assets/css/app.css?v=20261108d">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/config.js?v=20261108d"></script>
    <script src="assets/js/core.js?v=20261108d"></script>
    <script src="assets/js/player.js?v=20261108d"></script>
    <style>
        #draw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; touch-action: none; }
        #draw-canvas.active { pointer-events: auto; cursor: crosshair; }
        .drawing-hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 11; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.15); pointer-events: none; }
        .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); }
        .swatch.active { border-color: #fff; }
        #btn-draw.active { background: var(--brand); border-color: var(--brand); color: #fff; }
    </style>
</head>
<body>

<div class="workspace">
    <div class="workspace-main">
        <div class="workspace-stage" id="stage">
            <canvas id="draw-canvas"></canvas>
            <div class="drawing-hint hidden" id="draw-hint">Zeichenmodus aktiv – Video-Steuerung wieder mit „Fertig"</div>
        </div>
        <div class="stage-bar">
            <button class="btn btn-sm" id="btn-draw" onclick="toggleDrawing()"></button>
            <span class="sep"></span>
            <div class="swatch active" style="background:#e30613" data-color="#e30613"></div>
            <div class="swatch" style="background:#ffd400" data-color="#ffd400"></div>
            <div class="swatch" style="background:#22d3ee" data-color="#22d3ee"></div>
            <div class="swatch" style="background:#ffffff" data-color="#ffffff"></div>
            <span class="sep"></span>
            <button class="btn btn-sm btn-ghost" id="btn-undo" onclick="undo()" title="Rückgängig"></button>
            <button class="btn btn-sm btn-ghost" id="btn-clear" onclick="clearDraw()" title="Zeichnung löschen"></button>
        </div>
    </div>

    <aside class="workspace-side">
        <div class="side-head">
            <a href="index.html" class="crumb" id="crumb">Dashboard</a>
            <h1 id="title">Clip-Analyse</h1>
            <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap" id="badges"></div>
        </div>
        <div class="side-scroll"><div class="feed" id="comments"></div></div>
        <div class="composer">
            <textarea id="com-input" class="textarea" placeholder="Feedback schreiben … (@Nr markiert)"></textarea>
            <button class="btn btn-primary btn-icon" id="send-btn" onclick="sendComment()" title="Senden"></button>
        </div>
    </aside>
</div>

<script>
    const F = Falcons, I = F.icon, $ = id => document.getElementById(id);
    const user = F.requireUser();
    F.mountShell('dashboard', { bottomNav: false });

    const params = new URLSearchParams(location.search);
    const videoId = params.get('id'), type = params.get('type') || 'drive';
    let players = {}, admin = false, clip = null;

    $('crumb').innerHTML = I('arrowLeft', 'icon-sm') + ' Dashboard';
    $('btn-undo').innerHTML = I('undo', 'icon-sm');
    $('btn-clear').innerHTML = I('trash', 'icon-sm');
    $('send-btn').innerHTML = I('send');
    F.submitOnEnter($('com-input'), sendComment);
    F.onTimestamp = jumpTo;

    async function init() {
        if (!videoId) return location.replace('index.html');
        const [pSnap, isAdm, media] = await Promise.all([F.T('players').get(), F.isAdmin(), F.loadMedia()]);
        players = F.playerMap(pSnap); admin = isAdm;

        clip = media.find(m => m.id === videoId) || (type === 'drive'
            ? { id: videoId, type: 'drive', title: 'Clip', embedUrl: `https://drive.google.com/file/d/${videoId}/preview` }
            : null);
        if (!clip) { $('comments').innerHTML = F.empty('Clip nicht gefunden', '', 'video'); return; }

        await mediaView.show(clip);
        mediaView.overlay.appendChild($('draw-canvas'));   // Zeichenfläche liegt über dem Video, nicht über der Steuerleiste
        mediaView.overlay.appendChild($('draw-hint'));
        $('title').textContent = clip.title;
        document.title = `${clip.title} · Falcons Analyse-Hub`;
        $('badges').innerHTML = [clip.category, clip.position !== 'Alle' && clip.position, clip.type === 'youtube' ? 'YouTube' : 'Drive']
            .filter(Boolean).map(b => `<span class="badge">${F.esc(b)}</span>`).join('');
        F.markViewed('video_views', videoId);
        listen();
    }

    function listen() {
        $('comments').innerHTML = F.loading();
        F.T('comments').where('videoId', '==', videoId).onSnapshot(snap => {
            const docs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => F.parseTime(a.text) - F.parseTime(b.text));
            $('comments').innerHTML = docs.length
                ? docs.map(c => F.commentHtml(c, { me: user.nr, admin, onRead: 'F.toggleRead', onDelete: 'deleteComment' })).join('')
                : F.empty('Noch kein Feedback', 'Schreib den ersten Kommentar zu diesem Clip.', 'message');
        });
    }

    async function sendComment() {
        const input = $('com-input'), raw = input.value.trim();
        if (!raw) return;
        const { text, mentions } = F.resolveMentions(raw, players);
        await F.T('comments').add({ videoId, text, author: user.name, authorNr: user.nr, mentions, readBy: [], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        input.value = '';
    }
    function deleteComment(id) { F.deleteDoc('comments', id, 'Kommentar löschen?'); }

    const mediaView = new FalconsPlayer.Media($('stage'));
    function jumpTo(sec) {
        if (!mediaView.seek(sec)) F.toast('Springen ist nur bei YouTube-Clips möglich', 'error');
    }

    /* ------------------------------------------------------------ Zeichnen */
    const canvas = $('draw-canvas'), ctx = canvas.getContext('2d');
    let drawing = false, pen = '#e30613', stroke = false, history = [];

    function sizeCanvas() {
        const snapshot = canvas.width ? canvas.toDataURL() : null;
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        if (snapshot) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height); img.src = snapshot; }
    }
    function setDrawBtn() { $('btn-draw').innerHTML = drawing ? I('check', 'icon-sm') + ' Fertig' : I('pen', 'icon-sm') + ' Zeichnen'; }
    function toggleDrawing() {
        drawing = !drawing;
        canvas.classList.toggle('active', drawing);
        $('btn-draw').classList.toggle('active', drawing);
        $('draw-hint').classList.toggle('hidden', !drawing);
        if (drawing && canvas.width !== canvas.offsetWidth) sizeCanvas();
        setDrawBtn();
    }
    function clearDraw() { history.push(canvas.toDataURL()); ctx.clearRect(0, 0, canvas.width, canvas.height); }
    function undo() {
        const prev = history.pop(); if (!prev) return;
        const img = new Image(); img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); }; img.src = prev;
    }
    document.querySelectorAll('.swatch').forEach(s => s.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
        s.classList.add('active'); pen = s.dataset.color;
    }));

    function pos(e) {
        const r = canvas.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
        return { x: p.clientX - r.left, y: p.clientY - r.top };
    }
    function start(e) {
        if (!drawing) return; e.preventDefault();
        history.push(canvas.toDataURL()); if (history.length > 30) history.shift();
        const p = pos(e); stroke = true;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.strokeStyle = pen; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    }
    function move(e) { if (!stroke) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    function end() { stroke = false; }
    canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end);
    window.addEventListener('resize', () => { if (canvas.width) sizeCanvas(); });

    setDrawBtn();
    F.ready.then(init);
</script>
</body>
</html>
