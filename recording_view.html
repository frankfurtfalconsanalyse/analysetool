<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aufzeichnung · Falcons Analyse-Hub</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
        // Fängt Ladefehler ab (z. B. veraltete Dateien im Browser-Cache) statt einen leeren Bildschirm zu zeigen
        window.addEventListener('error', function (e) { showLoadError(e.message); });
        window.addEventListener('unhandledrejection', function (e) { showLoadError(e.reason && (e.reason.message || e.reason)); });
        function showLoadError(msg) {
            if (document.getElementById('load-error')) return;
            var go = function () {
                var d = document.createElement('div'); d.id = 'load-error';
                d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;max-width:calc(100% - 32px);background:#22262c;border:1px solid #e30613;color:#eceef1;padding:14px 16px;border-radius:12px;font:14px system-ui,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;gap:12px;align-items:center;flex-wrap:wrap';
                d.innerHTML = '<span>Es ist ein Fehler aufgetreten. Bitte neu laden.<br><small style="color:#9aa1ac">' + String(msg || '').replace(/</g, '&lt;').slice(0, 160) + '</small></span>';
                var b = document.createElement('button'); b.textContent = 'Neu laden';
                b.style.cssText = 'background:#e30613;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer';
                b.onclick = function () { location.reload(); }; d.appendChild(b); document.body.appendChild(d);
            };
            document.body ? go() : document.addEventListener('DOMContentLoaded', go);
        }
    </script>
    <link rel="stylesheet" href="assets/css/app.css?v=20261125c">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/config.js?v=20261125c"></script>
    <script src="assets/js/core.js?v=20261125c"></script>
    <script src="assets/js/player.js?v=20261125c"></script>
    <script src="assets/js/saisonmanager.js?v=20261125c"></script>
    <style>
        .time-row { display: flex; gap: 8px; }
        .time-row .input { font-family: var(--mono); }
        .admin-form { display: flex; flex-direction: column; gap: 10px; }
        .admin-form .textarea { min-height: 64px; }
        .admin-label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text-faint); }
        .side-foot { max-height: 58%; overflow-y: auto; padding: 0; }
        .side-foot .admin-form { padding: 12px 14px 14px; }
        /* Eingabebereich einklappbar: eingeklappt ist nur die Kopfzeile sichtbar */
        .admin-label { cursor: pointer; user-select: none; margin: -12px -14px 0; padding: 12px 14px; border-radius: 0; }
        .admin-label:hover { color: var(--text); background: var(--surface-2); }
        .admin-label .chev { margin-left: auto; transition: transform .2s; }
        .side-foot.collapsed .admin-label { margin-bottom: -14px; color: var(--text-muted); }
        .side-foot.collapsed .admin-label .chev { transform: rotate(180deg); }
        .side-foot.collapsed .admin-form > :not(.admin-label) { display: none; }
        .people { display: flex; flex-direction: column; gap: 8px; }
        .people .lbl { font-size: 12px; font-weight: 600; color: var(--text-muted); }
        .chip-pick { display: flex; flex-wrap: wrap; gap: 5px; }
        .chip-pick button { height: 28px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; }
        .chip-pick button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
        .tagline { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-muted); }
        .tag.me { background: var(--brand-soft); color: #ff6b73; }
        .tag b { color: var(--text); font-weight: 700; }
        .ev-actions { display: flex; gap: 2px; }
        .clip-row { display: flex; gap: 12px; padding: 12px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; }
        .clip-row + .clip-row { margin-top: 8px; }
        .clip-row:hover { background: var(--surface-3); }
        .clip-row.active { border-color: var(--info); }
        .clip-row .ci { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--info-soft); color: var(--info); flex-shrink: 0; }
        .clip-row .cm { flex: 1; min-width: 0; }
        .clip-row strong { display: block; font-size: 14px; }
        .clip-row small { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
        .form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        /* Spielstand an der aktuellen Videostelle */
        .live-score { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border-strong); font-size: 13px; font-weight: 600; color: var(--text-muted); flex-wrap: wrap; }
        .live-score b { font-family: var(--font-display); font-size: 17px; color: var(--text); letter-spacing: .5px; }
        .live-score em { font-style: normal; font-weight: 500; font-size: 12px; color: var(--text-faint); }
        .score-chip { font-family: var(--mono); font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface-3); color: var(--text); letter-spacing: 0; }
        /* Spielbericht / Saisonmanager */
        .sync-step { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); padding: 14px; }
        .sync-step + .sync-step { margin-top: 10px; }
        .sync-step h4 { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .sync-step h4 .n { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 12px; }
        .sync-step p.h { font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.45; }
        .sm-match { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); margin: 10px 0; }
        .sm-match b { font-family: var(--font-display); font-size: 22px; }
        .sm-match span { font-size: 13px; font-weight: 600; text-align: center; flex: 1; }
        .period-grid { display: grid; gap: 6px; margin-bottom: 10px; }
        .period-row { display: grid; grid-template-columns: minmax(78px, .8fr) 1fr 1fr; gap: 6px; align-items: center; }
        .period-row .pl { font-size: 12.5px; font-weight: 600; }
        .period-row .btn { height: auto; min-height: 40px; padding: 5px 8px; font-size: 12px; line-height: 1.2; flex-direction: column; gap: 1px; }
        .period-row .btn small { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--text-faint); }
        .period-row .btn.is-set { border-color: rgba(47,191,113,.45); background: var(--success-soft); }
        .period-row .btn.is-set small { color: var(--success); }
        .sm-opt { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--text-muted); margin-top: 8px; }
        .sm-opt input { accent-color: var(--brand); }
        details.sm-more { margin-top: 10px; }
        details.sm-more summary { cursor: pointer; font-size: 12.5px; color: var(--text-muted); }
        details.sm-more[open] summary { margin-bottom: 8px; }
        .anchor { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 6px 8px; border-radius: 7px; background: var(--surface); margin-top: 6px; }
        .anchor .mono { color: var(--text); }
        .anchor .sp { flex: 1; }
        .sm-ev { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: var(--surface); border-left: 3px solid var(--ev-color, var(--border-strong)); scroll-margin: 12px; }
        .sm-ev.active { box-shadow: inset 0 0 0 1px var(--border-strong); background: var(--surface-3); }
        .sm-ev.done .m small { color: var(--success); }
        .sm-read { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding-top: 8px; border-top: 1px dashed var(--border-strong); font-size: 12px; color: var(--text-muted); }
        .sm-read .input { width: 86px; height: 34px; font-family: var(--mono); }
        .sm-read .grow { flex-basis: 100%; line-height: 1.35; }
        @media (max-width: 960px) and (min-height: 640px) {
            /* Video steht oben fest: Zeile beim automatischen Scrollen darunter anzeigen */
            .sm-ev { scroll-margin-top: calc(var(--header-h) + 56.25vw + 110px); }
        }
        .sm-ev + .sm-ev { margin-top: 6px; }
        .sm-ev .m { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.35; }
        .sm-ev .m b { display: block; font-size: 12px; color: var(--text); }
        .sm-ev .m small { color: var(--text-faint); font-family: var(--mono); }
        .sm-ev .btn { flex-shrink: 0; }
        .sm-err { color: #ff5a63; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>

<!--
    Eine Ansicht für Spiele UND Trainings.
    recording_view.html?type=game&id=…      → Collections games / game_events / game_comments / game_views
    recording_view.html?type=training&id=…  → Collections trainings / training_events / training_comments / training_views
-->

<div class="workspace">
    <div class="workspace-main">
        <div class="notice hidden" id="blocked"></div>
        <div class="workspace-stage" id="stage"></div>
    </div>

    <aside class="workspace-side">
        <div class="side-head">
            <a class="crumb" id="crumb">Zurück</a>
            <h1 id="title">Aufzeichnung</h1>
            <p class="muted" id="date" style="font-size:13px; margin-top:2px"></p>
            <div class="live-score hidden" id="live-score" title="Spielstand an der aktuellen Videostelle"></div>
            <div class="hidden" id="rec-admin" style="display:flex; gap:6px; margin-top:10px">
                <button class="btn btn-sm hidden" onclick="openSync()" id="btn-sm"></button>
                <button class="btn btn-sm" onclick="editThis()" id="btn-edit-rec"></button>
                <button class="btn btn-sm btn-ghost btn-danger" onclick="deleteThis()" id="btn-del-rec"></button>
            </div>
            <div class="segmented full" style="margin-top:14px">
                <button id="tab-events" onclick="setMode('events')"></button>
                <button id="tab-clips" onclick="setMode('clips')"></button>
                <button id="tab-feedback" onclick="setMode('feedback')"></button>
            </div>
        </div>

        <div class="side-scroll">
            <div id="view-events"></div>
            <div id="view-clips" class="hidden"></div>
            <div id="view-sync" class="hidden"></div>
            <div id="view-feedback" class="hidden">
                <div id="player-pick" class="field hidden" style="margin-bottom:12px">
                    <label>Feedback für Spieler</label>
                    <select id="player-select" class="select" onchange="loadFeedback()"><option value="">Spieler auswählen …</option></select>
                </div>
                <div class="feed" id="feedback-list"></div>
            </div>
        </div>

        <!-- nur für Trainer/Admins -->
        <div class="side-foot collapsed hidden" id="admin-area">
            <div class="admin-form" id="form-events">
                <div class="admin-label" id="lbl-events" onclick="toggleFoot()"></div>
                <div class="time-row">
                    <select id="ev-type" class="select" style="flex:1"></select>
                    <input id="ev-time" class="input" placeholder="0:00:00" style="width:100px">
                    <button class="btn btn-icon" onclick="useCurrentTime('ev-time')" title="Aktuelle Videozeit übernehmen" id="btn-now1"></button>
                </div>
                <textarea id="ev-desc" class="textarea" placeholder="Beschreibung …"></textarea>
                <div class="people" id="ev-people"></div>
                <div class="time-row">
                    <button class="btn hidden" onclick="resetEventForm()" id="btn-cancel-event" style="flex:1">Abbrechen</button>
                    <button class="btn btn-primary" onclick="saveEvent()" id="btn-save-event" style="flex:2">Speichern</button>
                </div>
            </div>
            <div class="admin-form hidden" id="form-clips">
                <div class="admin-label" id="lbl-clips" onclick="toggleFoot()"></div>
                <div class="form-2">
                    <div class="field"><label>Start</label><div class="time-row"><input id="cl-start" class="input" placeholder="0:00:00"><button class="btn btn-icon" onclick="useCurrentTime('cl-start')" title="Aktuelle Videozeit" id="btn-now3"></button></div></div>
                    <div class="field"><label>Ende</label><div class="time-row"><input id="cl-end" class="input" placeholder="0:00:00"><button class="btn btn-icon" onclick="useCurrentTime('cl-end')" title="Aktuelle Videozeit" id="btn-now4"></button></div></div>
                </div>
                <button class="btn btn-sm" onclick="takeLoop()" id="btn-take-loop" title="Start/Ende aus der A–B-Schleife des Players übernehmen"></button>
                <input id="cl-title" class="input" placeholder="Titel, z. B. Konter über links">
                <div class="form-2">
                    <select id="cl-cat" class="select"></select>
                    <select id="cl-pos" class="select"></select>
                </div>
                <div class="people"><span class="lbl">Spieler markieren (sehen den Clip auf ihrem Dashboard)</span><div class="chip-pick" id="cl-players"></div></div>
                <div class="field"><label>In Session aufnehmen</label>
                    <select id="cl-session" class="select" onchange="$('cl-new-session').classList.toggle('hidden', this.value !== '__new')"></select>
                    <input id="cl-new-session" class="input hidden" placeholder="Titel der neuen Session" style="margin-top:6px">
                </div>
                <button class="btn btn-primary" onclick="saveClip()" id="btn-save-clip"></button>
            </div>
            <div class="admin-form hidden" id="form-feedback">
                <div class="admin-label" id="lbl-feedback" onclick="toggleFoot()"></div>
                <textarea id="fb-text" class="textarea" placeholder="Privates Feedback … Zeitstempel als 0:15:30"></textarea>
                <div class="time-row">
                    <button class="btn" onclick="insertCurrentTime()" id="btn-now2" style="flex:1"></button>
                    <button class="btn btn-primary" onclick="saveFeedback()" style="flex:1" id="btn-send-fb"></button>
                </div>
            </div>
        </div>
    </aside>
</div>

<script>
    const F = Falcons, I = F.icon, $ = id => document.getElementById(id);
    const user = F.requireUser();
    F.mountShell('library', { bottomNav: false });

    /* Konfiguration je Art der Aufzeichnung (Collection-Namen bleiben wie bisher) */
    const KINDS = {
        game: {
            col: 'games', events: 'game_events', comments: 'game_comments', views: 'game_views', fk: 'gameId',
            back: 'recordings.html?type=games', backLabel: 'Spiele', eventsLabel: 'Ereignisse', eventSingular: 'Ereignis',
            types: {
                goal:     { label: 'Falcons Tor', icon: 'target' },
                conceded: { label: 'Gegentor',    icon: 'net' },
                pp:       { label: 'Überzahl',    icon: 'zap' },
                pk:       { label: 'Unterzahl',   icon: 'minusCircle' },
                other:    { label: 'Sonstiges',   icon: 'flag' }
            }
        },
        training: {
            col: 'trainings', events: 'training_events', comments: 'training_comments', views: 'training_views', fk: 'trainingId',
            back: 'recordings.html?type=trainings', backLabel: 'Trainings', eventsLabel: 'Übungen', eventSingular: 'Übung',
            types: { drill: { label: 'Übung', icon: 'repeat' } }
        }
    };

    const params = new URLSearchParams(location.search);
    const kindKey = params.get('type') === 'training' ? 'training' : 'game';
    const K = KINDS[kindKey], itemId = params.get('id');
    let admin = false, yt = null, ytId = '', blocked = false, mode = 'events', unsubEvents = null, unsubFeedback = null, unsubClips = null;
    let roster = [], rec = {}, editingEvent = null, eventPeople = { scorer: '', assist: '', onIce: new Set(), players: new Set() }, clipPlayers = new Set();
    const pname = nr => { const p = roster.find(x => x.id === nr); return p ? p.name : ''; };

    // Statische Beschriftungen
    $('crumb').href = K.back;
    $('crumb').innerHTML = I('arrowLeft', 'icon-sm') + ' ' + K.backLabel;
    $('tab-events').innerHTML = I('list', 'icon-sm') + ' ' + K.eventsLabel;
    $('tab-clips').innerHTML = I('video', 'icon-sm') + ' Clips';
    const CHEV = I('chevronDown', 'icon-sm chev');
    $('lbl-clips').innerHTML = I('plus', 'icon-sm') + ' Clip aus dieser Aufzeichnung schneiden' + CHEV;
    $('btn-now3').innerHTML = $('btn-now4').innerHTML = I('clock', 'icon-sm');
    $('btn-take-loop').innerHTML = I('repeat', 'icon-sm') + ' A–B-Schleife übernehmen';
    $('btn-save-clip').innerHTML = I('save', 'icon-sm') + ' Clip speichern';
    $('cl-cat').innerHTML = F.CFG.categories.map(c => `<option>${c}</option>`).join('');
    $('cl-pos').innerHTML = ['Alle', ...F.CFG.positions].map(p => `<option value="${p}">${p === 'Alle' ? 'Alle Positionen' : p}</option>`).join('');
    $('ev-type').addEventListener('change', () => renderEventPeople());
    $('tab-feedback').innerHTML = I('message', 'icon-sm') + ' <span class="hide-sm">Mein </span>Feedback';
    $('lbl-events').innerHTML = I('plus', 'icon-sm') + ' ' + K.eventSingular + ' hinzufügen' + CHEV;
    $('lbl-feedback').innerHTML = I('lock', 'icon-sm') + ' Privates Feedback senden' + CHEV;
    $('btn-now1').innerHTML = I('clock', 'icon-sm');
    $('btn-now2').innerHTML = I('clock', 'icon-sm') + ' Zeit einfügen';
    $('btn-send-fb').innerHTML = I('send', 'icon-sm') + ' Senden';
    $('ev-type').innerHTML = Object.entries(K.types).map(([k, t]) => `<option value="${k}">${t.label}</option>`).join('');
    if (Object.keys(K.types).length === 1) $('ev-type').classList.add('hidden');
    F.onTimestamp = jumpTo;

    async function init() {
        if (!itemId) return location.replace(K.back);
        const [doc, pSnap] = await Promise.all([F.T(K.col).doc(itemId).get(), F.T('players').get()]);
        if (!doc.exists) { $('view-events').innerHTML = F.empty('Nicht gefunden', 'Diese Aufzeichnung existiert nicht mehr.', 'video'); return; }
        const d = doc.data();
        rec = d; ytId = d.ytId;
        roster = pSnap.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => a.id.localeCompare(b.id));
        $('title').textContent = d.title;
        $('date').textContent = F.fmtDate(d.date);
        document.title = `${d.title} · Falcons Analyse-Hub`;
        F.markViewed(K.views, itemId);

        admin = await F.isAdmin();
        if (admin) {
            $('admin-area').classList.remove('hidden');
            $('rec-admin').classList.remove('hidden');
            $('btn-edit-rec').innerHTML = I('pen', 'icon-sm') + ' Bearbeiten';
            $('btn-del-rec').innerHTML = I('trash', 'icon-sm') + ' Löschen';
            $('player-pick').classList.remove('hidden');
            $('tab-feedback').innerHTML = I('message', 'icon-sm') + ' <span class="hide-sm">Spieler-</span>Feedback';
            roster.forEach(p => $('player-select').insertAdjacentHTML('beforeend', `<option value="${p.id}">#${p.id} ${F.esc(p.name)}</option>`));
            renderEventPeople(); renderClipPlayers(); loadSessionOptions();
        }

        if (admin && kindKey === 'game') { $('btn-sm').classList.remove('hidden'); $('btn-sm').innerHTML = I('list', 'icon-sm') + ' Spielbericht'; }
        anchors = (rec.smSync || []).slice();
        yt = new FalconsPlayer($('stage'), { onTime: t => updateLiveScore(t), onError: code => {
            if (code == 101 || code == 150) {
                blocked = true;
                $('blocked').innerHTML = `${I('alert')} Dieses Video darf nicht eingebettet werden. Zeitstempel öffnen YouTube in einem neuen Tab.`;
                $('blocked').classList.remove('hidden');
            }
        } });
        if (ytId) yt.load(ytId, { autoplay: false }).then(() => { const t = +params.get('t'); if (t) yt.seek(t); });
        loadEvents();
        setMode(params.get('tab') === 'clips' ? 'clips' : params.get('tab') === 'sync' && admin ? 'sync' : 'events');
        if (mode === 'sync') openSync();
    }

    function jumpTo(sec) {
        if (blocked || !yt || !yt.ready) return window.open(`https://www.youtube.com/watch?v=${ytId}&t=${sec}s`, '_blank');
        yt.seek(sec);
    }

    /** Eingabebereich auf-/zuklappen (Zustand wird gemerkt; Standard: zugeklappt) */
    function toggleFoot(open) {
        const foot = $('admin-area');
        const willOpen = open === undefined ? foot.classList.contains('collapsed') : open;
        foot.classList.toggle('collapsed', !willOpen);
        try { localStorage.setItem('falcons_foot_open', willOpen ? '1' : ''); } catch (e) {}
    }
    try { if (localStorage.getItem('falcons_foot_open') === '1') $('admin-area').classList.remove('collapsed'); } catch (e) {}

    function setMode(m) {
        mode = m;
        $('tab-events').classList.toggle('active', m === 'events');
        $('tab-feedback').classList.toggle('active', m === 'feedback');
        $('tab-clips').classList.toggle('active', m === 'clips');
        ['events', 'clips', 'feedback'].forEach(k => { $('view-' + k).classList.toggle('hidden', m !== k); $('form-' + k).classList.toggle('hidden', m !== k); });
        $('view-sync').classList.toggle('hidden', m !== 'sync');
        if (admin) $('admin-area').classList.toggle('hidden', m === 'sync');
        if (m === 'events') loadEvents(); else if (m === 'clips') loadClips(); else if (m === 'feedback') loadFeedback();
    }

    /* ------------------------------------------------------------- Ereignisse */
    function loadEvents() {
        if (unsubEvents) return; // läuft bereits (Live-Update)
        $('view-events').innerHTML = F.loading();
        unsubEvents = F.T(K.events).where(K.fk, '==', itemId).onSnapshot(snap => {
            const docs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.sec - b.sec);
            events = docs;
            if (!docs.length) { $('view-events').innerHTML = F.empty(`Noch keine ${K.eventsLabel}`, admin ? `Füge unten das erste ${K.eventSingular} hinzu.` : 'Der Trainer hat hier noch nichts markiert.', 'list'); return; }
            $('view-events').innerHTML = docs.map(e => {
                const type = K.types[e.type] ? e.type : Object.keys(K.types)[0];
                const t = K.types[type];
                return `<div class="event ev-${type}" onclick="jumpTo(${+e.sec || 0})">
                    <div class="event-icon">${I(t.icon, 'icon-sm')}</div>
                    <div class="event-main">
                        <div class="event-title">${t.label} <span class="event-time">${F.esc(e.time)}</span>${e.smScore && (e.type === 'goal' || e.type === 'conceded') ? `<span class="score-chip">${F.esc(e.smScore)}</span>` : ''}</div>
                        <div class="event-desc">${F.esc(e.desc)}</div>
                        ${peopleTags(e)}
                    </div>
                    ${admin ? `<div class="ev-actions del">
                        <button class="btn btn-ghost btn-icon btn-sm" title="Clip aus dieser Szene" onclick="event.stopPropagation(); clipFromEvent('${e.id}')">${I('video', 'icon-sm')}</button>
                        <button class="btn btn-ghost btn-icon btn-sm" title="Bearbeiten" onclick="event.stopPropagation(); editEvent('${e.id}')">${I('pen', 'icon-sm')}</button>
                        <button class="btn btn-ghost btn-icon btn-sm btn-danger" title="Löschen" onclick="event.stopPropagation(); F.deleteDoc('${K.events}', '${e.id}')">${I('trash', 'icon-sm')}</button>
                    </div>` : ''}
                </div>`;
            }).join('');
        });
    }

    let events = [];

    /* Beteiligte Spieler: Tor → Torschütze, Vorlage, Auf dem Feld · Gegentor → Auf dem Feld · sonst → Beteiligt */
    function peopleTags(e) {
        const me = user.nr, tag = (nr, role) => `<span class="tag ${nr === me ? 'me' : ''}">${role ? role + ' ' : ''}<b>#${F.esc(nr)}</b> ${F.esc(pname(nr))}</span>`;
        const out = [];
        if (e.scorer) out.push(tag(e.scorer, 'Tor'));
        if (e.assist) out.push(tag(e.assist, 'Vorlage'));
        const rest = (e.onIce && e.onIce.length ? e.onIce : (e.players || [])).filter(n => n !== e.scorer && n !== e.assist);
        rest.forEach(n => out.push(tag(n, '')));
        return out.length ? `<div class="tagline">${out.join('')}</div>` : '';
    }
    function chipPick(id, set, onToggle) {
        $(id).innerHTML = roster.map(p => `<button type="button" class="${set.has(p.id) ? 'on' : ''}" data-nr="${p.id}" title="${F.esc(p.name)}">#${p.id} ${F.esc(p.name.split(' ')[0])}</button>`).join('') || '<span class="faint" style="font-size:12px">Kein Kader</span>';
        $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; const nr = b.dataset.nr; set.has(nr) ? set.delete(nr) : set.add(nr); b.classList.toggle('on'); if (onToggle) onToggle(); };
    }
    function renderEventPeople() {
        const type = kindKey === 'game' ? $('ev-type').value : 'drill', P = eventPeople;
        const opts = sel => `<option value="">–</option>` + roster.map(p => `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>#${p.id} ${F.esc(p.name)}</option>`).join('');
        let html = '';
        if (type === 'goal') html += `<div class="form-2"><div class="field"><label>Torschütze</label><select class="select" id="ev-scorer">${opts(P.scorer)}</select></div><div class="field"><label>Vorlage</label><select class="select" id="ev-assist">${opts(P.assist)}</select></div></div>`;
        const label = type === 'goal' || type === 'conceded' ? 'Auf dem Feld (für +/−)' : 'Beteiligte Spieler';
        html += `<span class="lbl">${label}</span><div class="chip-pick" id="ev-chips"></div>`;
        $('ev-people').innerHTML = html;
        chipPick('ev-chips', type === 'goal' || type === 'conceded' ? P.onIce : P.players);
        if ($('ev-scorer')) { $('ev-scorer').onchange = e => P.scorer = e.target.value; $('ev-assist').onchange = e => P.assist = e.target.value; }
    }
    function resetEventForm() {
        editingEvent = null; eventPeople = { scorer: '', assist: '', onIce: new Set(), players: new Set() };
        $('ev-time').value = ''; $('ev-desc').value = '';
        $('btn-cancel-event').classList.add('hidden');
        $('btn-save-event').textContent = 'Speichern';
        $('lbl-events').innerHTML = I('plus', 'icon-sm') + ' ' + K.eventSingular + ' hinzufügen' + CHEV;
        renderEventPeople();
    }
    function editEvent(id) {
        const e = events.find(x => x.id === id); if (!e) return;
        editingEvent = id;
        eventPeople = { scorer: e.scorer || '', assist: e.assist || '', onIce: new Set(e.onIce || []), players: new Set(e.onIce && e.onIce.length ? [] : (e.players || [])) };
        if (kindKey === 'game') $('ev-type').value = K.types[e.type] ? e.type : 'other';
        $('ev-time').value = e.time || ''; $('ev-desc').value = e.desc || '';
        $('btn-cancel-event').classList.remove('hidden');
        $('btn-save-event').textContent = 'Änderungen speichern';
        $('lbl-events').innerHTML = I('pen', 'icon-sm') + ' ' + K.eventSingular + ' bearbeiten' + CHEV;
        toggleFoot(true);
        renderEventPeople();
        $('form-events').scrollIntoView({ block: 'nearest' });
    }

    async function saveEvent() {
        const time = $('ev-time').value.trim(), desc = $('ev-desc').value.trim();
        if (!F.hasTime(time)) return F.toast('Bitte Zeit im Format 0:15:30 angeben', 'error');
        if (!desc) return F.toast('Bitte eine Beschreibung eingeben', 'error');
        const type = kindKey === 'game' ? $('ev-type').value : 'drill', P = eventPeople;
        const withIce = type === 'goal' || type === 'conceded';
        const data = { [K.fk]: itemId, time, desc, sec: F.parseTime(time) };
        if (kindKey === 'game') data.type = type;
        data.scorer = type === 'goal' ? P.scorer : '';
        data.assist = type === 'goal' ? P.assist : '';
        data.onIce = withIce ? [...P.onIce] : [];
        // players = alle Beteiligten → für „Meine Szenen“ (array-contains)
        data.players = [...new Set([data.scorer, data.assist, ...(withIce ? P.onIce : P.players)].filter(Boolean))];
        if (editingEvent) await F.T(K.events).doc(editingEvent).update(data);
        else await F.T(K.events).add({ ...data, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        F.toast(editingEvent ? 'Änderungen gespeichert' : `${K.eventSingular} gespeichert`);
        resetEventForm();
    }

    /* ----------------------------------------------------------------- Clips */
    function loadClips() {
        if (unsubClips) return;
        $('view-clips').innerHTML = F.loading();
        unsubClips = F.T('youtube_clips').where('source.id', '==', itemId).onSnapshot(snap => {
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.startTime || 0) - (b.startTime || 0));
            clips = list;
            $('view-clips').innerHTML = list.length ? list.map(c => `
                <div class="clip-row" data-id="${c.id}" onclick="playClip('${c.id}')">
                    <div class="ci">${I('play', 'icon-sm')}</div>
                    <div class="cm">
                        <strong>${F.esc(c.title)}</strong>
                        <small>${FalconsPlayer.fmt(c.startTime)} – ${FalconsPlayer.fmt(c.endTime)} · ${F.esc(c.category || '')}</small>
                        ${(c.players || []).length ? `<div class="tagline">${c.players.map(n => `<span class="tag ${n === user.nr ? 'me' : ''}"><b>#${F.esc(n)}</b> ${F.esc(pname(n))}</span>`).join('')}</div>` : ''}
                    </div>
                    <div class="ev-actions">
                        <a class="btn btn-ghost btn-icon btn-sm" title="Analyse-Modus" href="analyze.html?id=${c.id}&type=youtube" onclick="event.stopPropagation()">${I('eye', 'icon-sm')}</a>
                        ${admin ? `<button class="btn btn-ghost btn-icon btn-sm" title="Bearbeiten" onclick="event.stopPropagation(); editCutClip('${c.id}')">${I('pen', 'icon-sm')}</button>
                        <button class="btn btn-ghost btn-icon btn-sm btn-danger" title="Löschen" onclick="event.stopPropagation(); F.deleteDoc('youtube_clips', '${c.id}', 'Clip löschen?')">${I('trash', 'icon-sm')}</button>` : ''}
                    </div>
                </div>`).join('')
                : F.empty('Noch keine Clips', admin ? 'Szene im Video suchen, Start und Ende setzen und unten speichern – oder bei einem Ereignis auf das Video-Symbol klicken.' : 'Aus dieser Aufzeichnung wurden noch keine Clips geschnitten.', 'video');
        });

    let clips = [];
    function editCutClip(id) { const c = clips.find(x => x.id === id); if (c) F.editClip(c); }
    /** Diese Aufzeichnung bearbeiten / löschen */
    function editThis() {
        F.editRecording(kindKey, { id: itemId, ...rec }, { onDone: () => location.reload(), onDeleted: () => location.replace(K.back) });
    }
    async function deleteThis() { if (await F.deleteRecording(kindKey, itemId, rec.title)) location.replace(K.back); }
    /** Clip im großen Player als Schleife abspielen */
    function playClip(id) {
        const c = clips.find(x => x.id === id); if (!c || !yt.ready) return;
        document.querySelectorAll('.clip-row').forEach(r => r.classList.toggle('active', r.dataset.id === id));
        yt.loopA = c.startTime; yt.loopB = c.endTime; yt.renderLoop(); yt.seek(c.startTime);
    }
    function renderClipPlayers() { chipPick('cl-players', clipPlayers); }
    async function loadSessionOptions() {
        const snap = await F.T('sessions').orderBy('createdAt', 'desc').get();
        $('cl-session').innerHTML = `<option value="">Nicht in eine Session</option><option value="__new">+ Neue Session …</option>`
            + snap.docs.map(d => `<option value="${d.id}">${F.esc(d.data().title)}</option>`).join('');
    }
    function takeLoop() {
        if (!yt || yt.loopA === null || yt.loopB === null) return F.toast('Im Player erst A (Start) und B (Ende) setzen', 'error');
        $('cl-start').value = FalconsPlayer.fmt(yt.loopA); $('cl-end').value = FalconsPlayer.fmt(Math.ceil(yt.loopB));
    }
    function clipFromEvent(id) {
        const e = events.find(x => x.id === id); if (!e) return;
        setMode('clips'); toggleFoot(true);
        $('cl-start').value = FalconsPlayer.fmt(Math.max(0, e.sec - 8));
        $('cl-end').value = FalconsPlayer.fmt(e.sec + 4);
        $('cl-title').value = `${K.types[e.type] ? K.types[e.type].label : K.eventSingular}: ${e.desc}`.slice(0, 80);
        clipPlayers = new Set(e.players || []); renderClipPlayers();
        yt.loopA = Math.max(0, e.sec - 8); yt.loopB = e.sec + 4; yt.renderLoop(); yt.seek(yt.loopA);
        F.toast('Start/Ende vorgeschlagen – bei Bedarf anpassen');
    }
    async function saveClip() {
        const start = F.parseTime($('cl-start').value), end = F.parseTime($('cl-end').value), title = $('cl-title').value.trim();
        if (!F.hasTime($('cl-start').value) || !F.hasTime($('cl-end').value)) return F.toast('Start und Ende im Format 0:15:30 angeben', 'error');
        if (end <= start) return F.toast('Das Ende muss nach dem Start liegen', 'error');
        if (!title) return F.toast('Bitte einen Titel eingeben', 'error');
        const sessionChoice = $('cl-session').value, newTitle = $('cl-new-session').value.trim();
        if (sessionChoice === '__new' && !newTitle) return F.toast('Bitte einen Titel für die neue Session eingeben', 'error');
        const clip = {
            title, ytId, startTime: start, endTime: end, category: $('cl-cat').value, position: $('cl-pos').value,
            players: [...clipPlayers], source: { type: kindKey, id: itemId, title: rec.title || '' }, createdAt: new Date()
        };
        if (rec.opponentId) clip.opponentId = rec.opponentId;
        const ref = await F.T('youtube_clips').add(clip);
        if (sessionChoice === '__new') {
            await F.T('sessions').add({ title: newTitle, description: '', videoIds: [ref.id], createdAt: new Date() });
            loadSessionOptions();
        } else if (sessionChoice) {
            await F.T('sessions').doc(sessionChoice).update({ videoIds: firebase.firestore.FieldValue.arrayUnion(ref.id) });
        }
        F.toast(sessionChoice ? 'Clip gespeichert und zur Session hinzugefügt' : 'Clip gespeichert');
        $('cl-title').value = ''; $('cl-start').value = ''; $('cl-end').value = ''; $('cl-new-session').value = '';
        $('cl-session').value = ''; $('cl-new-session').classList.add('hidden');
        clipPlayers = new Set(); renderClipPlayers();
    }

    /* --------------------------------------------------------------- Feedback */
    function loadFeedback() {
        const nr = admin ? $('player-select').value : user.nr;
        if (unsubFeedback) { unsubFeedback(); unsubFeedback = null; }
        if (!nr) { $('feedback-list').innerHTML = F.empty('Spieler auswählen', 'Wähle oben einen Spieler, um sein privates Feedback zu sehen oder zu schreiben.', 'user'); return; }
        $('feedback-list').innerHTML = F.loading();
        unsubFeedback = F.T(K.comments).where(K.fk, '==', itemId).where('targetNr', '==', nr).onSnapshot(snap => {
            const docs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => F.parseTime(a.text) - F.parseTime(b.text));
            $('feedback-list').innerHTML = docs.length ? F.threadHtml(docs, c => ({ me: user.nr, admin, onDelete: 'deleteFeedback', onReply: 'sendFeedbackReply', label: c.authorNr === nr ? '' : 'privat' }))
                : F.empty('Kein Feedback', admin ? 'Für diesen Spieler gibt es noch kein Feedback.' : 'Für dich gibt es zu dieser Aufzeichnung noch kein persönliches Feedback.', 'message');
        });
    }

    function deleteFeedback(id) { F.deleteDoc(K.comments, id, 'Löschen?'); }
    /** Antwort auf privates Feedback – Spieler antworten auf ihr eigenes, Coaches im gewählten Spieler */
    async function sendFeedbackReply(parentId, text) {
        const targetNr = admin ? $('player-select').value : user.nr;
        await F.T(K.comments).add({ [K.fk]: itemId, targetNr, parentId, text, author: user.name, authorNr: user.nr, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }

    async function saveFeedback() {
        const nr = $('player-select').value, text = $('fb-text').value.trim();
        if (!nr) return F.toast('Bitte zuerst einen Spieler auswählen', 'error');
        if (!text) return F.toast('Bitte Feedback eingeben', 'error');
        await F.T(K.comments).add({ [K.fk]: itemId, targetNr: nr, text, author: user.name, authorNr: user.nr, createdAt: firebase.firestore.FieldValue.serverTimestamp() });

        F.toast('Feedback gesendet');

    /* ------------------------------------------------------ Videozeit-Helfer */
    function currentTime() {
        const s = yt ? Math.floor(yt.time()) : 0;
        return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }
    function useCurrentTime(id) { $(id).value = currentTime(); }
    function insertCurrentTime() {
        const ta = $('fb-text'), t = currentTime() + ' ';
        const p = ta.selectionStart ?? ta.value.length;
        ta.value = ta.value.slice(0, p) + t + ta.value.slice(p);
        ta.focus(); ta.selectionStart = ta.selectionEnd = p + t.length;
    }


    /* ------------------------------------------------ Spielbericht (Saisonmanager) */
    const SMx = Saisonmanager;
    let smGame = null, anchors = [], smSide = null, smError = '', smLoading = false, smActive = null;

    /** Unterbrechungen nach Toren/Strafen (für die gestoppte Spielzeit) – aus dem Bericht oder am Spiel gespeichert */
    const smStops = () => smGame ? SMx.stopsFromGame(smGame) : ((rec.sm && rec.sm.stops) || []);
    const smEst = (period, clock) => SMx.estimate(anchors, period, clock, smStops());
    const smCountdown = () => !!(rec.sm && rec.sm.countdown);
    const smList = () => smGame ? smGame.events.filter(e => e.type === 'goal' || e.type === 'penalty') : [];

    function openSync() {
        setMode('sync');
        renderSync();
        if (!smGame && !smLoading && rec.sm && rec.sm.link) loadSm(rec.sm.link);
    }

    async function loadSm(link) {
        smLoading = true; smError = ''; renderSync();
        try {
            smGame = await SMx.load(link);
            smSide = (rec.sm && rec.sm.weAre) || SMx.weAre(smGame);
            await saveSmMeta();
        } catch (e) { console.warn(e); smError = e.message || String(e); }
        smLoading = false; renderSync();
    }

    async function saveSmMeta(extra = {}) {
        const sm = { id: smGame.id, link: smGame.link, weAre: smSide, home: smGame.home, guest: smGame.guest,
            stops: SMx.stopsFromGame(smGame), countdown: smCountdown(), ...extra };
        rec.sm = sm;
        await F.T('games').doc(itemId).update({ sm });
    }
    async function setSide(side) { smSide = side; await saveSmMeta(); renderSync(); }
    async function setCountdown(on) { await saveSmMeta({ countdown: !!on }); renderSync(); }

    /** Abgelesene Spieluhr („7:40“, „7.40“, „740“) → Sekunden seit Drittelbeginn (rückwärts laufende Uhr umgerechnet) */
    function readClock(period, raw) {
        const m = String(raw || '').trim().match(/^(\d{0,2})[:.,]?(\d{2})$/);
        if (!m || +m[2] > 59) { F.toast('Spieluhr wie im Video eingeben, z. B. 7:40', 'error'); return null; }
        const c = (+m[1] || 0) * 60 + (+m[2]), len = SMx.periodLen(period);
        if (c > len) { F.toast(`Die Uhr geht in diesem Abschnitt nur bis ${len / 60}:00`, 'error'); return null; }
        return smCountdown() ? len - c : c;
    }

    /** Abgleichspunkt: aktuelle Videostelle = angegebene Spielzeit. Gibt die Videozeit zurück. */
    function addAnchor(period, clock, { ev = null, quiet = false } = {}) {
        if (!yt || !yt.ready) { F.toast('Video ist noch nicht bereit', 'error'); return null; }
        const video = Math.round(yt.time() * 10) / 10;
        anchors = anchors.filter(a => !(a.period === period && Math.abs(a.clock - clock) < 2) && !(ev !== null && a.ev === ev));
        anchors.push(ev !== null ? { period, clock, video, ev } : { period, clock, video });
        anchors.sort((a, b) => a.period - b.period || a.clock - b.clock);
        F.T('games').doc(itemId).update({ smSync: anchors });
        rec.smSync = anchors;
        if (!quiet) F.toast(`Abgeglichen: ${anchorLabel(anchors.find(a => a.video === video && a.period === period))} = Video ${F.fmtTime(video)}`);
        updateLiveScore(yt.time(), true);
        return video;
    }
    function anchorLabel(a) {
        if (!a) return '';
        const p = SMx.periodLabel(a.period);
        if (a.ev !== undefined && smGame) { const e = smGame.events.find(x => x.id === a.ev); if (e) return `${e.type === 'goal' ? 'Tor ' + e.home + ':' + e.guest : 'Strafe'} · ${p} ${e.time}`; }
        if (a.clock === 0) return `Anpfiff ${p}`;
        if (a.clock === SMx.periodLen(a.period)) return `Ende ${p}`;
        return `${p} · Uhr ${SMx.fmtClock(a.clock)}`;
    }
    function markPeriod(period, which) {
        // Bestätigung steht direkt im Knopf (✓ + Videozeit)
        if (addAnchor(period, which === 'start' ? 0 : SMx.periodLen(period), { quiet: true }) !== null) renderSync();
    }
    function addClockAnchor() {
        const period = +$('sm-period').value, c = readClock(period, $('sm-clock').value);
        if (c === null) return;
        if (addAnchor(period, c) !== null) { $('sm-clock').value = ''; renderSync(); }
    }
    function removeAnchor(i) {
        anchors.splice(i, 1);
        F.T('games').doc(itemId).update({ smSync: anchors }); rec.smSync = anchors;
        renderSync(); if (yt) updateLiveScore(yt.time(), true);
    }

    /* Tor für Tor: ▶ springt hin, „Jetzt“ bestätigt, abgelesene Uhr korrigiert */
    const smEvent = id => smList().find(e => e.id === id);
    function showActive() {
        requestAnimationFrame(() => { const r = document.getElementById('smev-' + smActive); if (r) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
    }
    function smJump(id) {
        const e = smEvent(id); if (!e) return;
        const est = smEst(e.period, SMx.clockSec(e.time));
        smActive = id; renderSync();
        if (est === null) return F.toast(`Erst Anpfiff ${SMx.periodLabel(e.period)} markieren (Schritt 1)`, 'error');
        yt.seek(Math.max(0, Math.round(est) - 10));
    }
    function smConfirm(id) {
        const e = smEvent(id); if (!e) return;
        if (addAnchor(e.period, SMx.clockSec(e.time), { ev: e.id, quiet: true }) === null) return;
        const list = smList(), i = list.findIndex(x => x.id === id);
        const next = list.slice(i + 1).find(x => !anchors.some(a => a.ev === x.id));
        smActive = next ? next.id : null;
        renderSync(); showActive();
    }
    /** Coach liest die Spieluhr im Video ab → neuer Abgleichspunkt, Video springt passend */
    function smRead(id) {
        const e = smEvent(id); if (!e) return;
        const c = readClock(e.period, $('sm-read').value);
        if (c === null) return;
        const v = addAnchor(e.period, c, { quiet: true });
        if (v === null) return;
        const goal = SMx.clockSec(e.time), gap = goal - c, what = e.type === 'goal' ? 'Tor' : 'Strafe';
        let target;
        if (gap >= 0 && gap <= 60) {
            // Spieluhr läuft nie schneller als das Video: frühestens in „gap“ Sekunden – einfach weiterschauen
            target = v + gap - 10;
            F.toast(gap ? `Noch ${gap} s Spielzeit bis zum ${what} – weiterschauen (bei Unterbrechungen dauert es länger)` : `${what} ist genau hier`);
        } else {
            target = smEst(e.period, goal) - 10;
            F.toast(gap < 0 ? `${what} ist schon vorbei – Video springt zurück` : `Noch ${SMx.fmtClock(gap)} Spielzeit – Video springt näher heran`);
        }
        renderSync();
        yt.seek(Math.max(0, Math.round(target)));
    }

    function renderSync() {
        const el = $('view-sync');
        const link = (rec.sm && rec.sm.link) || '';
        let html = `<button class="crumb" style="background:none;border:0;cursor:pointer;margin-bottom:10px" onclick="setMode('events')">${I('arrowLeft', 'icon-sm')} Zurück zu den Ereignissen</button>
            <div class="sync-step">
                <h4>${I('list', 'icon-sm')} Spielbericht aus dem Saisonmanager</h4>
                <div class="time-row"><input id="sm-link" class="input" placeholder="https://saisonmanager.de/…/spiel/12345" value="${F.esc(link)}">
                <button class="btn btn-primary" onclick="loadSm($('sm-link').value)" ${smLoading ? 'disabled' : ''}>${smLoading ? 'Lädt …' : 'Laden'}</button></div>
                ${smError ? `<p class="sm-err">${F.esc(smError)}</p>` : ''}
            </div>`;
        if (smGame) {
            const g = smGame, us = smSide, cd = smCountdown();
            html += `<div class="sm-match"><span>${F.esc(g.home.name)}</span><b>${g.result.home ?? '–'} : ${g.result.guest ?? '–'}</b><span>${F.esc(g.guest.name)}</span></div>
                <div class="segmented full" style="margin-bottom:10px"><button class="${us === 'home' ? 'active' : ''}" onclick="setSide('home')">Wir sind Heim</button><button class="${us === 'guest' ? 'active' : ''}" onclick="setSide('guest')">Wir sind Gast</button></div>`;
            // Schritt 1: Drittel markieren
            const periods = [...new Set(g.events.map(e => e.period).concat([1, 2, 3]))].filter(p => p <= 4).sort();
            const mark = (p, which) => {
                const a = anchors.find(x => x.period === p && x.clock === (which === 'start' ? 0 : SMx.periodLen(p)));
                return `<button class="btn btn-sm ${a ? 'is-set' : ''}" onclick="markPeriod(${p}, '${which}')" title="Aktuelle Videostelle = ${which === 'start' ? 'Anpfiff' : 'Schlusssirene'}">
                    <span>${a ? I('check', 'icon-sm') : ''} ${which === 'start' ? 'Anpfiff' : 'Ende'}</span><small>${a ? F.fmtTime(a.video) : 'ist jetzt'}</small></button>`;
            };
            html += `<div class="sync-step"><h4><span class="n">1</span> Drittel im Video markieren</h4>
                <p class="h">Floorball läuft mit gestoppter Zeit – ein Drittel dauert im Video oft 30 Minuten und mehr. Spule zu <b>Anpfiff</b> und <b>Schlusssirene</b> jedes Drittels und tippe den Knopf. Die Unterbrechungen nach Toren und Strafen rechnet der Hub dazwischen selbst ein.</p>
                <div class="period-grid">${periods.map(p => `<div class="period-row"><span class="pl">${SMx.periodLabel(p)}</span>${mark(p, 'start')}${mark(p, 'end')}</div>`).join('')}</div>
                <label class="sm-opt"><input type="checkbox" ${cd ? 'checked' : ''} onchange="setCountdown(this.checked)"> Die Uhr im Video läuft rückwärts (20:00 → 0:00)</label>
                <details class="sm-more"><summary>Spieluhr an einer anderen Stelle eintragen · ${anchors.length} Abgleichspunkte</summary>
                    <div class="time-row"><select id="sm-period" class="select" style="flex:1">${periods.map(p => `<option value="${p}">${SMx.periodLabel(p)}</option>`).join('')}</select>
                        <input id="sm-clock" class="input mono" placeholder="${cd ? '12:20' : '7:40'}" title="Spieluhr wie im Video (Minuten:Sekunden)" inputmode="decimal" style="width:96px">
                        <button class="btn" onclick="addClockAnchor()" title="Aktuelle Videostelle = diese Spieluhr">${I('clock', 'icon-sm')}</button></div>
                    ${anchors.map((a, i) => `<div class="anchor">${I('check', 'icon-sm')} <span>${F.esc(anchorLabel(a))}</span><span class="sp"></span>
                        <span class="mono ts" data-sec="${Math.floor(a.video)}">${F.fmtTime(a.video)}</span>
                        <button class="btn btn-ghost btn-icon btn-sm" title="Entfernen" onclick="removeAnchor(${i})">${I('x', 'icon-sm')}</button></div>`).join('')}
                </details>
            </div>`;
            // Schritt 2: Tor für Tor
            const list = smList();
            html += `<div class="sync-step"><h4><span class="n">2</span> Tore & Strafen im Video finden (${list.filter(e => e.type === 'goal').length} Tore, ${list.filter(e => e.type === 'penalty').length} Strafen)</h4>
                <p class="h">▶ springt 10 Sekunden vor die geschätzte Stelle. Siehst du das Tor: <b>Jetzt</b> tippen – das nächste ist dann schon ausgewählt. Passt es nicht, die <b>Spieluhr im Video ablesen</b> und eintragen: der Hub springt dann so, dass du nur noch weiterschauen musst.</p>
                ${list.map(e => {
                    const est = smEst(e.period, SMx.clockSec(e.time));
                    const ours = e.team === us, isGoal = e.type === 'goal';
                    const done = anchors.find(a => a.ev === e.id), active = smActive === e.id;
                    const color = isGoal ? (ours ? 'var(--brand)' : 'var(--text-muted)') : (ours ? 'var(--warning)' : 'var(--info)');
                    const who = e.number ? `#${e.number} ${SMx.playerName(g, e.team, e.number)}` : '';
                    const info = done ? `✓ bestätigt · Video ${F.fmtTime(done.video)}` : est === null ? `Anpfiff ${SMx.periodLabel(e.period)} fehlt` : 'Video ≈ ' + F.fmtTime(est);
                    return `<div class="sm-ev ${active ? 'active' : ''} ${done ? 'done' : ''}" id="smev-${e.id}" style="--ev-color:${color}">
                        ${isGoal ? `<span class="score-chip">${e.home}:${e.guest}</span>` : `<span class="score-chip">2'</span>`}
                        <div class="m"><b>${isGoal ? (ours ? 'Tor' : 'Gegentor') : (ours ? 'Strafe gegen uns' : 'Strafe Gegner')} · ${SMx.periodLabel(e.period)} ${F.esc(e.time)}</b>${F.esc(who)}${isGoal && e.assist ? ' · V: #' + e.assist : ''}${!isGoal && e.reason ? ' · ' + F.esc(e.reason) : ''}
                            <br><small>${info}</small></div>
                        <button class="btn btn-sm btn-icon" title="10 s vorher anspringen" onclick="smJump(${e.id})" ${est === null ? 'disabled' : ''}>${I('play', 'icon-sm')}</button>
                        <button class="btn btn-sm ${active ? 'btn-primary' : ''}" title="${isGoal ? 'Das Tor fällt' : 'Die Strafe wird gepfiffen'} genau jetzt im Video" onclick="smConfirm(${e.id})">Jetzt</button>
                        ${active ? `<div class="sm-read"><span class="grow">Andere Zeit im Video? Spieluhr ablesen:</span>
                            <input id="sm-read" class="input" placeholder="${cd ? '12:20' : '7:40'}" inputmode="decimal" onkeydown="if (event.key === 'Enter') smRead(${e.id})">
                            <button class="btn btn-sm" onclick="smRead(${e.id})">${I('clock', 'icon-sm')} Springen</button></div>` : ''}
                    </div>`;
                }).join('')}
            </div>`;
            // Schritt 3: Eintragen
            const ready = list.filter(e => smEst(e.period, SMx.clockSec(e.time)) !== null).length;
            const confirmed = list.filter(e => anchors.some(a => a.ev === e.id)).length;
            html += `<div class="sync-step"><h4><span class="n">3</span> Als Ereignisse eintragen</h4>
                <label class="sm-opt" style="margin:0 0 10px"><input type="checkbox" id="sm-pen" checked> Strafen als Über-/Unterzahl eintragen</label>
                <button class="btn btn-primary btn-block" onclick="importSm()" ${ready ? '' : 'disabled'}>${I('save', 'icon-sm')} ${ready} Ereignisse eintragen / aktualisieren</button>
                <p class="h" style="margin:10px 0 0">${confirmed} von ${list.length} im Video bestätigt${confirmed < ready ? ' – die übrigen werden geschätzt eingetragen und lassen sich später jederzeit genauer abgleichen und neu eintragen' : ''}. Jedes Tor wird 10 Sekunden vor dem Treffer eingetragen, mit Spielstand, Torschütze und Vorlage (unsere Spieler werden markiert). Erneutes Eintragen aktualisiert die Zeiten statt doppelt anzulegen.</p>
            </div>`;
        }
        el.innerHTML = html;
    }

    async function importSm() {
        const { events: evs, missing } = SMx.buildEvents(smGame, anchors, smSide, roster.map(p => p.id), { penalties: $('sm-pen').checked });
        const existingSnap = await F.T(K.events).where(K.fk, '==', itemId).get();
        const existing = new Map();
        existingSnap.docs.forEach(d => { const x = d.data(); if (x.smEventId !== undefined && x.smEventId !== null) existing.set(x.smEventId, { id: d.id, ...x }); });
        let added = 0, updated = 0;
        const batch = db.batch();
        evs.forEach(e => {
            const base = { type: e.type, time: F.fmtTime(e.sec), sec: e.sec, desc: e.desc, smEventId: e.smEventId, smGoalSec: e.smGoalSec, smScore: e.smScore, smPeriod: e.smPeriod, smClock: e.smClock };
            const old = existing.get(e.smEventId);
            if (old) {
                // manuell gepflegte Spieler-Markierungen behalten
                const upd = { ...base };
                if (!old.scorer && e.scorer) upd.scorer = e.scorer;
                if (!old.assist && e.assist) upd.assist = e.assist;
                upd.players = [...new Set([...(old.players || []), ...e.players])];
                batch.update(F.T(K.events).doc(old.id), upd); updated++;
            } else {
                batch.set(F.T(K.events).doc(), { [K.fk]: itemId, ...base, scorer: e.scorer, assist: e.assist, players: e.players, onIce: [], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                added++;
            }
        });
        // Endergebnis + Gegner ins Spiel übernehmen
        const r = smGame.result || {}, us = smSide, them = us === 'home' ? 'guest' : 'home';
        const gameUpd = {};
        if (r.home !== undefined && r.home !== null) { gameUpd.scoreFor = +r[us]; gameUpd.scoreAgainst = +r[them]; }
        if (!rec.opponentId) {
            const oppName = smGame[them].name;
            try {
                const opps = await F.T('opponents').get();
                const hit = opps.docs.find(d => (d.data().name || '').trim().toLowerCase() === oppName.trim().toLowerCase());
                gameUpd.opponentId = hit ? hit.id : (await F.T('opponents').add({ name: oppName, createdAt: new Date() })).id;
            } catch (e) { console.warn('Gegner nicht übernommen', e); }
        }
        if (Object.keys(gameUpd).length) batch.update(F.T('games').doc(itemId), gameUpd);
        await batch.commit();
        Object.assign(rec, gameUpd);
        F.toast(`${added} neu, ${updated} aktualisiert${missing.length ? `, ${missing.length} ohne Abgleich übersprungen` : ''}`);
        setMode('events');
    }

    /** Spielstand (und geschätzte Spielzeit) an der aktuellen Videostelle */
    let lastLs = -99;
    function updateLiveScore(t, force) {
        if (kindKey !== 'game' || (!force && Math.abs(t - lastLs) < 0.5)) return;
        lastLs = t;
        const el = $('live-score');
        const imported = events.filter(e => e.smScore && e.smGoalSec !== undefined && (e.type === 'goal' || e.type === 'conceded')).sort((a, b) => a.smGoalSec - b.smGoalSec);
        let html;
        if (imported.length && rec.sm) {
            let sc = '0:0'; imported.forEach(e => { if (e.smGoalSec <= t) sc = e.smScore; });
            html = `<span>${F.esc(rec.sm.home.short || 'Heim')}</span><b>${sc}</b><span>${F.esc(rec.sm.guest.short || 'Gast')}</span>`;
        } else {
            const all = events.filter(e => e.type === 'goal' || e.type === 'conceded');
            if (!all.length) { el.classList.add('hidden'); return; }
            const ours = all.filter(e => e.type === 'goal' && e.sec <= t).length, theirs = all.filter(e => e.type === 'conceded' && e.sec <= t).length;
            html = `<span>Falcons</span><b>${ours}:${theirs}</b><span>Gegner</span>`;
        }
        const pos = anchors.length ? SMx.inverse(anchors, t, smStops()) : null;
        if (pos) html += `<em>${pos.pause ? 'Pause nach dem ' + SMx.periodLabel(pos.period) : SMx.periodLabel(pos.period) + ' ≈ ' + SMx.fmtClock(pos.clock)}</em>`;
        el.innerHTML = html; el.classList.remove('hidden');
    }

    F.ready.then(init);
</script>
</body>
</html>
