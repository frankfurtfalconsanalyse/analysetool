<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard · Falcons Analyse-Hub</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/core.js"></script>
    <style>
        /* ---------- Login ---------- */
        .login-screen {
            min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(227, 6, 19, 0.18), transparent 60%),
                var(--bg);
        }
        .login-card { width: 100%; max-width: 380px; padding: 36px 32px 28px; text-align: center; }
        .login-logo { width: 112px; height: 112px; object-fit: contain; margin: -8px auto 10px; filter: drop-shadow(0 8px 24px rgba(227,6,19,.25)); }
        .login-card h1 { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: .3px; }
        .login-card .sub { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        .login-step { display: none; margin-top: 28px; }
        .login-step.active { display: block; }
        .login-step label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; }
        .code-input {
            width: 100%; height: 64px; text-align: center; font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: 12px;
            background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius); color: var(--text); outline: none;
        }
        .code-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
        .code-input + .code-input { margin-top: 10px; }
        .login-error { min-height: 20px; margin-top: 12px; font-size: 13px; color: #ff5a63; }
        .login-link { background: none; border: 0; color: var(--text-muted); font-size: 13px; cursor: pointer; margin-top: 8px; }
        .login-link:hover { color: var(--text); }
        .login-foot { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-faint); }

        /* ---------- Dashboard ---------- */
        .hero {
            position: relative; overflow: hidden; padding: 32px; border-radius: var(--radius-lg);
            background: linear-gradient(120deg, #1b0d0f 0%, #141518 55%); border: 1px solid #3a1a1d;
            display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end;
        }
        .hero::before { content: ""; position: absolute; right: -80px; top: -80px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(227,6,19,.22), transparent 70%); }
        .hero > * { position: relative; }
        .hero h2 { font-family: var(--font-display); font-size: 28px; font-weight: 800; margin-top: 4px; }
        .hero p { color: var(--text-muted); margin-top: 10px; max-width: 640px; }
        .hero .stats { display: flex; gap: 18px; margin-top: 18px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }
        .hero .stats span { display: inline-flex; align-items: center; gap: 6px; }
        .hero .progress { margin-top: 18px; max-width: 420px; }
        @media (max-width: 720px) { .hero { grid-template-columns: 1fr; padding: 24px; } .hero h2 { font-size: 22px; } }

        .session-card { display: flex; flex-direction: column; gap: 12px; padding: 18px; cursor: pointer; transition: border-color .2s, transform .2s; }
        .session-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
        .session-card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .session-card h3 { font-size: 15px; font-weight: 600; }
        .session-card p { font-size: 13px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .session-card .foot { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); margin-top: auto; }
        .session-card .foot .progress { flex: 1; }

        /* Clip-Modal */
        .clip-layout { display: flex; min-height: 0; flex: 1; }
        .clip-video { flex: 1; min-width: 0; background: #000; position: relative; aspect-ratio: 16 / 9; }
        .clip-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        .clip-side { width: 360px; display: flex; flex-direction: column; border-left: 1px solid var(--border); min-height: 0; }
        .clip-side .side-scroll { max-height: none; }
        @media (max-width: 900px) {
            .clip-layout { flex-direction: column; overflow-y: auto; }
            .clip-side { width: 100%; border-left: 0; border-top: 1px solid var(--border); flex: 1; }
        }
    </style>
</head>
<body>

<!-- ============================ LOGIN ============================ -->
<div id="login" class="login-screen hidden">
    <div class="card login-card">
        <img class="login-logo" src="assets/img/logo.png" alt="Frankfurt Falcons">
        <h1>FALCONS ANALYSE-HUB</h1>
        <p class="sub">Frankfurt Falcons · Floorball</p>

        <div id="step-nr" class="login-step active">
            <label for="login-nr">Deine Trikotnummer</label>
            <input id="login-nr" class="code-input" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="00">
            <button class="btn btn-primary btn-lg btn-block" style="margin-top:14px" onclick="checkNr(true)">Weiter</button>
        </div>

        <div id="step-setup" class="login-step">
            <label>Erster Login – wähle eine 4-stellige PIN</label>
            <input id="setup-pin" class="code-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
            <input id="setup-pin2" class="code-input" type="password" inputmode="numeric" maxlength="4" placeholder="wiederholen">
            <button class="btn btn-primary btn-lg btn-block" style="margin-top:14px" onclick="savePin()">PIN speichern & starten</button>
            <button class="login-link" onclick="resetLogin()">Andere Nummer</button>
        </div>

        <div id="step-pin" class="login-step">
            <label id="welcome-user">Willkommen zurück</label>
            <input id="login-pin" class="code-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
            <button class="login-link" onclick="resetLogin()">Falsche Nummer? Zurück</button>
        </div>

        <div class="login-error" id="login-error"></div>
        <div class="login-foot">PIN vergessen? Ein Trainer kann sie im Admin-Bereich zurücksetzen.</div>
    </div>
</div>

<!-- ============================ DASHBOARD ============================ -->
<main id="app" class="page hidden">

    <!-- Übersicht -->
    <div id="view-home">
        <div class="page-head">
            <div>
                <div class="eyebrow" id="today"></div>
                <h1 id="greeting">Hallo</h1>
                <p>Deine Video-Analysen, Sessions und persönliches Feedback.</p>
            </div>
        </div>

        <section class="section" id="hero-wrap"></section>

        <section class="section">
            <div class="section-head"><h2>Für dich markiert <span class="count" id="mention-count">0</span></h2></div>
            <div id="mention-grid"></div>
        </section>

        <section class="section">
            <div class="section-head"><h2>Sessions <span class="count" id="session-count">0</span></h2></div>
            <div id="session-grid" class="grid"></div>
        </section>

        <section class="section">
            <div class="section-head">
                <h2>Clip-Bibliothek <span class="count" id="clip-count">0</span></h2>
                <button class="btn btn-sm" onclick="showLibrary('all')">Alle Clips</button>
            </div>
            <h3 class="faint" style="font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; margin:4px 0 12px">Spielsituation</h3>
            <div id="cat-tiles" class="grid grid-sm"></div>
            <h3 class="faint" style="font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; margin:28px 0 12px">Position</h3>
            <div id="pos-tiles" class="grid grid-sm"></div>
        </section>
    </div>

    <!-- Gefilterte Clip-Liste -->
    <div id="view-library" class="hidden">
        <div class="page-head">
            <div>
                <button class="btn btn-ghost btn-sm" style="margin-left:-12px; margin-bottom:8px" onclick="showHome()"><span id="back-icon"></span> Zurück zur Übersicht</button>
                <h1 id="library-title">Clips</h1>
                <p id="library-sub"></p>
            </div>
        </div>
        <div id="library-grid" class="grid"></div>
    </div>
</main>

<!-- ============================ CLIP-MODAL ============================ -->
<div id="clip-modal" class="modal" onclick="if(event.target===this) closeClip()">
    <div class="modal-panel">
        <div class="modal-head">
            <div style="min-width:0">
                <div class="faint" style="font-size:12px" id="clip-meta"></div>
                <h3 id="clip-title" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis">Clip</h3>
            </div>
            <div style="display:flex; gap:8px; flex-shrink:0">
                <a class="btn btn-sm btn-primary" id="clip-analyse"><span id="pen-icon"></span>Analyse-Modus</a>
                <button class="btn btn-sm btn-icon" onclick="closeClip()" id="close-btn" title="Schließen"></button>
            </div>
        </div>
        <div class="clip-layout">
            <div class="clip-video"><iframe id="clip-frame" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
            <div class="clip-side">
                <div class="side-scroll"><div class="feed" id="clip-comments"></div></div>
                <div class="composer">
                    <textarea id="clip-input" class="textarea" placeholder="Feedback schreiben … (@Nr markiert)"></textarea>
                    <button class="btn btn-primary btn-icon" onclick="sendClipComment()" id="send-btn" title="Senden"></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const F = Falcons, I = F.icon;
    let user = null, admin = false, media = [], players = {}, currentClip = null, unsubComments = null, loginCandidate = null;

    /* ------------------------------------------------------------------ LOGIN */
    const $ = id => document.getElementById(id);
    const onlyDigits = el => el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, ''); $('login-error').textContent = ''; });
    ['login-nr', 'setup-pin', 'setup-pin2', 'login-pin'].forEach(id => onlyDigits($(id)));
    $('login-nr').addEventListener('input', () => { if ($('login-nr').value.length === 2) checkNr(); });
    $('login-nr').addEventListener('keydown', e => { if (e.key === 'Enter') checkNr(true); });
    $('login-pin').addEventListener('input', () => { if ($('login-pin').value.length === 4) verifyPin(); });
    $('setup-pin2').addEventListener('keydown', e => { if (e.key === 'Enter') savePin(); });

    function showStep(id) {
        document.querySelectorAll('.login-step').forEach(s => s.classList.toggle('active', s.id === id));
        const input = document.querySelector(`#${id} input`); if (input) setTimeout(() => input.focus(), 50);
    }
    function loginError(msg) { $('login-error').textContent = msg; }
    function resetLogin() { loginCandidate = null; $('login-nr').value = ''; $('login-pin').value = ''; loginError(''); showStep('step-nr'); }

    async function checkNr(force) {
        let nr = $('login-nr').value;
        if (force && nr.length === 1) nr = '0' + nr;
        if (nr.length !== 2) return force && loginError('Bitte Trikotnummer eingeben.');
        try {
            const doc = await db.collection('players').doc(nr).get();
            if (!doc.exists) return loginError(`Nummer #${nr} ist nicht im Kader.`);
            const d = doc.data();
            loginCandidate = { nr, name: d.name, authVersion: d.authVersion || 0 };
            if (!d.uid) showStep('step-setup');   // noch kein Konto → erster Login
            else { $('welcome-user').textContent = `Hallo ${loginCandidate.name} – deine PIN`; showStep('step-pin'); }
        } catch (e) { loginError('Verbindung fehlgeschlagen. Bitte erneut versuchen.'); }
    }

    async function savePin() {
        const p1 = $('setup-pin').value, p2 = $('setup-pin2').value;
        if (p1.length !== 4) return loginError('Die PIN muss 4 Ziffern haben.');
        if (p1 !== p2) return loginError('Die PINs stimmen nicht überein.');
        busy(true);
        try { await F.register(loginCandidate, p1); location.reload(); }
        catch (e) { console.error(e); auth.signOut(); busy(false); loginError(F.authError(e)); }
    }

    async function verifyPin() {
        busy(true);
        try { await F.signIn(loginCandidate, $('login-pin').value); location.reload(); }
        catch (e) { busy(false); $('login-pin').value = ''; loginError(F.authError(e)); $('login-pin').focus(); }
    }

    function busy(on) {
        document.querySelectorAll('#login input, #login button').forEach(el => el.disabled = on);
        if (on) loginError('');
        $('login-error').innerHTML = on ? '<div class="spinner" style="margin:0 auto; width:18px; height:18px"></div>' : $('login-error').innerHTML;
    }

    /* -------------------------------------------------------------- DASHBOARD */
    async function boot() {
        user = await F.authState;
        if (!user) { $('login').classList.remove('hidden'); showStep('step-nr'); return; }

        F.mountShell('dashboard');
        $('app').classList.remove('hidden');
        $('greeting').textContent = `Hallo ${user.name.split(' ')[0]}`;
        $('today').textContent = new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
        $('back-icon').outerHTML = I('arrowLeft');
        $('pen-icon').outerHTML = I('pen', 'icon-sm');
        $('close-btn').innerHTML = I('x');
        $('send-btn').innerHTML = I('send');
        F.submitOnEnter($('clip-input'), sendClipComment);
        F.onTimestamp = jumpTo;
        F.openClip = openClip;

        $('hero-wrap').innerHTML = '<div class="skeleton" style="height:180px"></div>';
        $('session-grid').innerHTML = $('mention-grid').innerHTML = F.loading();

        const [m, sessSnap, progSnap, pSnap, isAdm] = await Promise.all([
            F.loadMedia(),
            db.collection('sessions').orderBy('createdAt', 'desc').get(),
            db.collection('progress').doc(user.nr).get(),
            db.collection('players').get(),
            F.isAdmin()
        ]);
        media = m; players = F.playerMap(pSnap); admin = isAdm;

        renderSessions(sessSnap, progSnap.exists ? progSnap.data() : {});
        renderTiles();
        loadMentions();
    }

    function renderSessions(snap, progress) {
        $('session-count').textContent = snap.size;
        if (!snap.size) {
            $('hero-wrap').classList.add('hidden');
            $('session-grid').outerHTML = `<div id="session-grid">${F.empty('Noch keine Sessions', 'Sobald ein Trainer eine Session erstellt, erscheint sie hier.', 'layers')}</div>`;
            return;
        }
        const items = snap.docs.map(d => {
            const s = d.data(), total = (s.videoIds || []).length, done = Math.min(progress[d.id] || 0, total);
            return { id: d.id, ...s, total, done, pct: total ? Math.round(done / total * 100) : 0 };
        });

        const h = items[0];
        $('hero-wrap').innerHTML = `<div class="hero">
            <div>
                <div class="eyebrow">Neueste Session</div>
                <h2>${F.esc(h.title)}</h2>
                ${h.description ? `<p>${F.esc(h.description)}</p>` : ''}
                <div class="stats">
                    <span>${I('layers', 'icon-sm')} ${h.total} Clips</span>
                    <span>${I('calendar', 'icon-sm')} ${F.fmtDate(h.createdAt)}</span>
                    <span>${I('eye', 'icon-sm')} ${h.done} von ${h.total} angesehen</span>
                </div>
                <div class="progress"><span style="width:${h.pct}%"></span></div>
            </div>
            <a class="btn btn-primary btn-lg" href="session_view.html?id=${h.id}">${I('play')} ${h.done ? (h.done >= h.total ? 'Erneut ansehen' : 'Fortsetzen') : 'Session starten'}</a>
        </div>`;

        $('session-grid').innerHTML = items.map(s => `
            <a class="card session-card" href="session_view.html?id=${s.id}">
                <div class="top">
                    <span class="badge ${s.done >= s.total && s.total ? 'badge-success' : s.done ? 'badge-warning' : 'badge-brand'}">
                        ${s.done >= s.total && s.total ? I('check', 'icon-sm') + ' Abgeschlossen' : s.done ? 'In Bearbeitung' : 'Neu'}
                    </span>
                    <span class="faint" style="font-size:12px">${F.fmtDate(s.createdAt)}</span>
                </div>
                <h3>${F.esc(s.title)}</h3>
                ${s.description ? `<p>${F.esc(s.description)}</p>` : ''}
                <div class="foot"><div class="progress"><span style="width:${s.pct}%"></span></div><span>${s.done}/${s.total}</span></div>
            </a>`).join('');
    }

    async function loadMentions() {
        const snap = await db.collection('comments').where('mentions', 'array-contains', user.nr).get();
        const byClip = new Map();
        snap.forEach(doc => {
            const c = doc.data();
            if ((c.readBy || []).includes(user.nr)) return;
            byClip.set(c.videoId, (byClip.get(c.videoId) || 0) + 1);
        });
        const cards = [...byClip].map(([vid, n]) => {
            const v = media.find(x => x.id === vid);
            return v ? F.mediaCard(v, { label: n === 1 ? 'Neue Markierung' : `${n} neue Markierungen` }) : '';
        }).filter(Boolean);
        $('mention-count').textContent = cards.length;
        $('mention-grid').className = cards.length ? 'grid' : '';
        $('mention-grid').innerHTML = cards.length ? cards.join('') : F.empty('Alles erledigt', 'Du hast kein offenes Feedback. Wenn dich ein Trainer mit @Nummer markiert, erscheint der Clip hier.', 'at');
    }

    const CAT_ICONS = { 'Offense': 'arrowUpRight', 'Defense': 'shield', 'Powerplay': 'zap', 'Penalty Kill': 'minusCircle', 'Setplays': 'target' };
    const POS_ICONS = { 'Angriff': 'arrowUpRight', 'Center': 'crosshair', 'Verteidigung': 'shield', 'Goalie': 'net' };
    const filters = {
        all: { title: 'Alle Clips', fn: () => true },
        cat: v => ({ title: v, sub: 'Spielsituation', fn: x => x.category === v }),
        pos: v => ({ title: v, sub: 'Position · inkl. Clips für alle Positionen', fn: x => x.position === v || x.position === 'Alle' })
    };

    function renderTiles() {
        $('clip-count').textContent = media.length;
        const tile = (kind, v, ic, n) => `<div class="tile" onclick="showLibrary('${kind}', '${v}')">
            <div class="tile-icon">${I(ic)}</div><div><h4>${v}</h4><small>${n} Clips</small></div>${I('chevronRight', 'chev icon-sm')}</div>`;
        $('cat-tiles').innerHTML = F.CFG.categories.map(c => tile('cat', c, CAT_ICONS[c] || 'video', media.filter(filters.cat(c).fn).length)).join('');
        $('pos-tiles').innerHTML = F.CFG.positions.map(p => tile('pos', p, POS_ICONS[p] || 'user', media.filter(filters.pos(p).fn).length)).join('');
    }

    function showLibrary(kind, value) {
        const f = kind === 'all' ? filters.all : filters[kind](value);
        const list = media.filter(f.fn);
        $('library-title').textContent = f.title;
        $('library-sub').textContent = `${f.sub ? f.sub + ' · ' : ''}${list.length} Clips`;
        $('library-grid').className = list.length ? 'grid' : '';
        $('library-grid').innerHTML = list.length ? list.map(v => F.mediaCard(v)).join('') : F.empty('Keine Clips', 'In dieser Kategorie gibt es noch keine Clips.', 'video');
        $('view-home').classList.add('hidden'); $('view-library').classList.remove('hidden');
        window.scrollTo(0, 0);
    }
    function showHome() { $('view-library').classList.add('hidden'); $('view-home').classList.remove('hidden'); }

    /* ------------------------------------------------------------- CLIP-MODAL */
    function openClip(id) {
        currentClip = media.find(x => x.id === id);
        if (!currentClip) return;
        $('clip-frame').src = currentClip.embedUrl;
        $('clip-title').textContent = currentClip.title;
        $('clip-meta').textContent = [currentClip.category, currentClip.position !== 'Alle' && currentClip.position].filter(Boolean).join(' · ');
        $('clip-analyse').href = `analyze.html?id=${encodeURIComponent(id)}&type=${currentClip.type}`;
        $('clip-modal').classList.add('open');
        document.body.style.overflow = 'hidden';
        F.markViewed('video_views', id);

        if (unsubComments) unsubComments();
        $('clip-comments').innerHTML = F.loading();
        unsubComments = db.collection('comments').where('videoId', '==', id).onSnapshot(snap => {
            const docs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => F.parseTime(a.text) - F.parseTime(b.text));
            $('clip-comments').innerHTML = docs.length
                ? docs.map(c => F.commentHtml(c, { me: user.nr, admin, onRead: 'F.toggleRead', onDelete: 'deleteComment' })).join('')
                : F.empty('Noch kein Feedback', 'Schreib den ersten Kommentar zu diesem Clip.', 'message');
        });
    }

    function closeClip() {
        $('clip-modal').classList.remove('open'); $('clip-frame').src = '';
        document.body.style.overflow = '';
        if (unsubComments) { unsubComments(); unsubComments = null; }
        loadMentions();
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('clip-modal').classList.contains('open')) closeClip(); });

    function jumpTo(sec) {
        if (currentClip && currentClip.type === 'youtube')
            $('clip-frame').src = `https://www.youtube.com/embed/${currentClip.ytId}?start=${sec}&autoplay=1&rel=0`;
        else F.toast('Springen ist nur bei YouTube-Clips möglich', 'error');
    }

    async function sendClipComment() {
        const input = $('clip-input'), raw = input.value.trim();
        if (!raw || !currentClip) return;
        const { text, mentions } = F.resolveMentions(raw, players);
        await db.collection('comments').add({ videoId: currentClip.id, text, author: user.name, authorNr: user.nr, mentions, readBy: [], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        input.value = '';
    }
    function deleteComment(id) { F.deleteDoc('comments', id, 'Kommentar löschen?'); }

    boot();
</script>
</body>
</html>
