<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Session · Falcons Analyse-Hub</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
        // Fängt Ladefehler ab (z. B. veraltete Dateien im Browser-Cache) statt einen leeren Bildschirm zu zeigen
        window.addEventListener('error', function (e) { showLoadError(e.message); });
        window.addEventListener('unhandledrejection', function (e) { showLoadError(e.reason && (e.reason.message || e.reason)); });
        function showLoadError(msg) {
            if (document.getElementById('load-error')) return;
            var go = function () {
                var d = document.createElement('div'); d.id = 'load-error';
                d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;max-width:calc(100% - 32px);background:#22262c;border:1px solid #e30613;color:#eceef1;padding:14px 16px;border-radius:12px;font:14px system-ui,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;gap:12px;align-items:center;flex-wrap:wrap';
                d.innerHTML = '<span>Es ist ein Fehler aufgetreten. Bitte neu laden.<br><small style="color:#9aa1ac">' + String(msg || '').replace(/</g, '&lt;').slice(0, 160) + '</small></span>';
                var b = document.createElement('button'); b.textContent = 'Neu laden';
                b.style.cssText = 'background:#e30613;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer';
                b.onclick = function () { location.reload(); }; d.appendChild(b); document.body.appendChild(d);
            };
            document.body ? go() : document.addEventListener('DOMContentLoaded', go);
        }
    </script>
    <link rel="stylesheet" href="assets/css/app.css?v=20261108g">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/config.js?v=20261108g"></script>
    <script src="assets/js/core.js?v=20261108g"></script>
    <script src="assets/js/player.js?v=20261108g"></script>
    <script src="assets/js/tactic-board.js?v=20261108g"></script>
    <style>
        .tactic-stage { position: absolute; inset: 0; padding: 12px 12px 64px; background: radial-gradient(ellipse at center, #1a1d22, #0e0f12); }
        .tactic-controls { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 12px; background: rgba(19,21,25,.92); border: 1px solid var(--border); max-width: calc(100% - 24px); }
        .tactic-controls .phase-chip { min-width: 32px; height: 32px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-muted); font-weight: 700; font-size: 12px; cursor: pointer; }
        .tactic-controls .phase-chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
        .tactic-note { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 7px 14px; border-radius: 999px; background: rgba(19,21,25,.92); border: 1px solid var(--border); font-size: 13px; font-weight: 500; }
        .clip-list { max-height: 34%; overflow-y: auto; padding: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .clip-list .list-item .kind { color: var(--text-faint); }
        .stage-bar .counter { flex: 1; text-align: center; font-size: 13px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
        @media (max-width: 960px) { .clip-list { max-height: none; } }
    </style>
</head>
<body>

<div class="workspace">
    <div class="workspace-main">
        <div class="workspace-stage">
            <div id="tactic-stage" class="tactic-stage hidden">
                <div id="tactic-host" style="width:100%; height:100%"></div>
                <div class="tactic-note hidden" id="tactic-note"></div>
                <div class="tactic-controls" id="tactic-controls"></div>
            </div>
        </div>
        <div class="stage-bar">
            <button class="btn btn-sm" id="btn-prev" onclick="go(-1)" title="Vorheriger Clip (P)"></button>
            <div class="counter" id="counter">–</div>
            <button class="btn btn-sm btn-primary" id="btn-next" onclick="go(1)" title="Nächster Clip (N)"></button>
        </div>
    </div>

    <aside class="workspace-side">
        <div class="side-head">
            <a href="index.html" class="crumb" id="crumb">Dashboard</a>
            <h1 id="s-title">Session</h1>
            <p class="muted" id="s-desc" style="font-size:13px; margin-top:6px"></p>
            <div class="progress" style="margin-top:12px"><span id="s-progress" style="width:0"></span></div>
        </div>
        <div class="clip-list" id="toc"></div>
        <div class="side-scroll"><div class="feed" id="comments"></div></div>
        <div class="composer">
            <textarea id="com-input" class="textarea" placeholder="Feedback schreiben … (@Nr markiert)"></textarea>
            <button class="btn btn-primary btn-icon" id="send-btn" onclick="sendComment()" title="Senden"></button>
        </div>
    </aside>
</div>

<script>
    const F = Falcons, I = F.icon, $ = id => document.getElementById(id);
    const user = F.requireUser();
    F.mountShell('dashboard', { bottomNav: false });

    const sessionId = new URLSearchParams(location.search).get('id');
    let clips = [], idx = 0, players = {}, admin = false, unsub = null, maxSeen = 0;

    $('crumb').innerHTML = I('arrowLeft', 'icon-sm') + ' Dashboard';
    $('btn-prev').innerHTML = I('chevronLeft', 'icon-sm') + ' Zurück';
    $('btn-next').innerHTML = 'Weiter ' + I('chevronRight', 'icon-sm');
    $('send-btn').innerHTML = I('send');
    F.submitOnEnter($('com-input'), sendComment);
    F.onTimestamp = jumpTo;

    async function init() {
        if (!sessionId) return location.replace('index.html');
        const [sDoc, pSnap, media, progDoc, isAdm] = await Promise.all([
            F.T('sessions').doc(sessionId).get(),
            F.T('players').get(),
            F.loadMedia({ tactics: true }),
            user.nr ? F.T('progress').doc(user.nr).get() : Promise.resolve({ exists: false, data: () => ({}) }),
            F.isAdmin()
        ]);
        if (!sDoc.exists) { document.querySelector('.workspace').innerHTML = `<div class="page">${F.empty('Session nicht gefunden', 'Sie wurde evtl. gelöscht.', 'layers')}</div>`; return; }

        const s = sDoc.data();
        players = F.playerMap(pSnap); admin = isAdm;
        $('s-title').textContent = s.title;
        $('s-desc').textContent = s.description || '';
        document.title = `${s.title} · Falcons Analyse-Hub`;
        clips = (s.videoIds || []).map(id => media.find(m => m.id === id)).filter(Boolean);
        maxSeen = (progDoc.exists && progDoc.data()[sessionId]) || 0;

        if (!clips.length) { $('comments').innerHTML = F.empty('Leere Session', 'Diese Session enthält keine (verfügbaren) Clips.', 'layers'); return; }
        // Dort weitermachen, wo der Spieler aufgehört hat
        play(Math.min(Math.max(maxSeen - 1, 0), clips.length - 1));
    }

    function play(i) {
        idx = i;
        const m = clips[i];
        const tactic = m.type === 'tactic';
        $('tactic-stage').classList.toggle('hidden', !tactic);
        if (tactic) { mediaView.hide(); tacticView.load(m.tacticData); }
        else { tacticView.stop(); mediaView.show(m); }

        $('counter').textContent = `Clip ${i + 1} von ${clips.length}`;
        $('btn-prev').disabled = i === 0;
        $('btn-next').disabled = i === clips.length - 1;
        renderToc();
        listen(m.id);
        saveProgress(i + 1);
    }

    function go(step) { const n = idx + step; if (n >= 0 && n < clips.length) play(n); }

    function renderToc() {
        const KIND = { drive: 'Drive', youtube: 'YouTube', tactic: 'Taktik' };
        $('toc').innerHTML = clips.map((c, i) => `
            <div class="list-item ${i === idx ? 'active' : ''}" onclick="play(${i})">
                <span class="num">${i < maxSeen && i !== idx ? I('check', 'icon-sm') : i + 1}</span>
                <span class="title">${F.esc(c.title)}</span>
                <small class="kind">${KIND[c.type]}</small>
            </div>`).join('');
        $('s-progress').style.width = Math.round(Math.min(maxSeen, clips.length) / clips.length * 100) + '%';
    }

    function saveProgress(n) {
        // Es zählt der am weitesten angesehene Clip (zurückspringen setzt den Fortschritt nicht zurück)
        if (n <= maxSeen) return;
        maxSeen = n;
        renderToc();
        if (user.nr) F.T('progress').doc(user.nr).set({ [sessionId]: n }, { merge: true });
    }

    function listen(videoId) {
        if (unsub) unsub();
        $('comments').innerHTML = F.loading();
        unsub = F.T('comments').where('videoId', '==', videoId).onSnapshot(snap => {
            const docs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => F.parseTime(a.text) - F.parseTime(b.text));
            $('comments').innerHTML = docs.length
                ? F.threadHtml(docs, { me: user.nr, admin, onRead: 'F.toggleRead', onDelete: 'deleteComment', onReply: 'sendReply' })
                : F.empty('Noch kein Feedback', 'Zu diesem Clip gibt es noch keine Kommentare.', 'message');
        });
    }

    function jumpTo(sec) {
        if (!mediaView.seek(sec)) F.toast('Springen ist nur bei YouTube-Clips möglich', 'error');
    }

    async function sendComment() {
        const input = $('com-input'), raw = input.value.trim();
        if (!raw || !clips[idx]) return;
        const { text, mentions } = F.resolveMentions(raw, players);
        await F.T('comments').add({ videoId: clips[idx].id, text, author: user.name, authorNr: user.nr, mentions, readBy: [], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        input.value = '';
    }
    function deleteComment(id) { F.deleteDoc('comments', id, 'Kommentar löschen?'); }
    /** Antwort auf einen Kommentar (gleicher Clip, parentId = Kommentar) */
    async function sendReply(parentId, raw) {
        const { text, mentions } = F.resolveMentions(raw, players);
        await F.T('comments').add({ videoId: clips[idx].id, parentId, text, author: user.name, authorNr: user.nr, mentions, readBy: [], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    /** Zeichnungen werden im Analyse-Modus angezeigt */
    F.onDrawing = id => { location.href = `analyze.html?id=${encodeURIComponent(clips[idx].id)}&type=${clips[idx].type}&c=${id}`; };

    /* Taktik-Board (nur ansehen, mit Phasen + Abspielen) */
    const mediaView = new FalconsPlayer.Media(document.querySelector('.workspace-stage'));
    let tacticView = null;
    tacticView = new TacticBoard.Board($('tactic-host'), { editable: false, onChange: syncTactic });
    function syncTactic() {
        if (!tacticView) return;
        const n = tacticView.board.phases.length, note = tacticView.current.note;
        $('tactic-note').textContent = note || '';
        $('tactic-note').classList.toggle('hidden', !note);
        $('tactic-controls').classList.toggle('hidden', n < 2);
        if (n < 2) return;
        $('tactic-controls').innerHTML = tacticView.board.phases.map((_, i) => `<button class="phase-chip ${i === tacticView.phase ? 'active' : ''}" onclick="tacticView.setPhase(${i})">${i + 1}</button>`).join('')
            + `<button class="btn btn-sm btn-primary" onclick="tacticView.playing ? tacticView.stop() : tacticView.play(); syncTactic()">${tacticView.playing ? I('pause', 'icon-sm') + ' Stopp' : I('play', 'icon-sm') + ' Abspielen'}</button>`;
    }
    // N = nächster Clip, P = vorheriger Clip (Pfeiltasten steuern den Video-Player)
    document.addEventListener('keydown', e => {
        if (e.target.matches('textarea, input') || e.metaKey || e.ctrlKey) return;
        if (e.key.toLowerCase() === 'n') go(1);
        if (e.key.toLowerCase() === 'p') go(-1);
    });

    F.ready.then(init);
</script>
</body>
</html>
