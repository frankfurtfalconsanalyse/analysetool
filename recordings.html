<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spiele & Trainings · Falcons Analyse-Hub</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
        // Fängt Ladefehler ab (z. B. veraltete Dateien im Browser-Cache) statt einen leeren Bildschirm zu zeigen
        window.addEventListener('error', function (e) { showLoadError(e.message); });
        window.addEventListener('unhandledrejection', function (e) { showLoadError(e.reason && (e.reason.message || e.reason)); });
        function showLoadError(msg) {
            if (document.getElementById('load-error')) return;
            var go = function () {
                var d = document.createElement('div'); d.id = 'load-error';
                d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;max-width:calc(100% - 32px);background:#22262c;border:1px solid #e30613;color:#eceef1;padding:14px 16px;border-radius:12px;font:14px system-ui,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;gap:12px;align-items:center;flex-wrap:wrap';
                d.innerHTML = '<span>Es ist ein Fehler aufgetreten. Bitte neu laden.<br><small style="color:#9aa1ac">' + String(msg || '').replace(/</g, '&lt;').slice(0, 160) + '</small></span>';
                var b = document.createElement('button'); b.textContent = 'Neu laden';
                b.style.cssText = 'background:#e30613;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer';
                b.onclick = function () { location.reload(); }; d.appendChild(b); document.body.appendChild(d);
            };
            document.body ? go() : document.addEventListener('DOMContentLoaded', go);
        }
    </script>
    <link rel="stylesheet" href="assets/css/app.css?v=20261108c">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/config.js?v=20261108c"></script>
    <script src="assets/js/core.js?v=20261108c"></script>
</head>
<body>

<main class="page">
    <div class="page-head">
        <div>
            <div class="eyebrow">Aufzeichnungen</div>
            <h1>Spiele & Trainings</h1>
            <p>Komplette Aufzeichnungen mit Ereignis-Timeline und deinem persönlichen Trainer-Feedback.</p>
        </div>
        <div class="segmented">
            <button id="tab-games" onclick="show('games')">Spiele</button>
            <button id="tab-trainings" onclick="show('trainings')">Trainings</button>
        </div>
    </div>
    <div id="grid" class="grid"></div>
</main>

<script>
    const F = Falcons, I = F.icon, $ = id => document.getElementById(id);
    const user = F.requireUser();
    F.mountShell('library');

    const KINDS = {
        games:     { views: 'game_views',     viewType: 'game',     label: 'Spiel',    empty: 'Noch keine Spiele hochgeladen.' },
        trainings: { views: 'training_views', viewType: 'training', label: 'Training', empty: 'Noch keine Trainings hochgeladen.' }
    };

    async function show(kind) {
        if (!KINDS[kind]) kind = 'games';
        const k = KINDS[kind];
        history.replaceState(null, '', `?type=${kind}`);
        $('tab-games').classList.toggle('active', kind === 'games');
        $('tab-trainings').classList.toggle('active', kind === 'trainings');
        $('grid').className = 'grid';
        $('grid').innerHTML = F.loading();

        const [snap, viewDoc] = await Promise.all([
            F.T(kind).orderBy('date', 'desc').get(),
            user.nr ? F.T(k.views).doc(user.nr).get() : Promise.resolve({ exists: false, data: () => ({}) })
        ]);
        const seen = viewDoc.exists ? viewDoc.data() : {};

        if (!snap.size) { $('grid').className = ''; $('grid').innerHTML = F.empty('Noch nichts da', k.empty, 'video'); return; }
        $('grid').innerHTML = snap.docs.map(d => {
            const g = d.data();
            return `<a class="media-card" href="recording_view.html?type=${k.viewType}&id=${d.id}">
                <div class="media-thumb" style="background-image:url('${F.ytThumb(g.ytId)}')">
                    <div class="play">${I('play')}</div>
                    <div class="corner">${seen[d.id] ? `<span class="badge badge-success">${I('check', 'icon-sm')} Gesehen</span>` : `<span class="badge badge-brand">Neu</span>`}</div>
                </div>
                <div class="media-body">
                    <div class="meta">${I('calendar', 'icon-sm')} ${F.fmtDate(g.date)} · ${k.label}</div>
                    <h3>${F.esc(g.title)}</h3>
                </div>
            </a>`;
        }).join('');
    }

    F.ready.then(() => show(new URLSearchParams(location.search).get('type') || 'games'));
</script>
</body>
</html>
