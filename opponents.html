<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gegner · Falcons Analyse-Hub</title>
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
        window.addEventListener('error', function (e) { showLoadError(e.message); });
        window.addEventListener('unhandledrejection', function (e) { showLoadError(e.reason && (e.reason.message || e.reason)); });
        function showLoadError(msg) {
            if (document.getElementById('load-error')) return;
            var go = function () {
                var d = document.createElement('div'); d.id = 'load-error';
                d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;max-width:calc(100% - 32px);background:#22262c;border:1px solid #e30613;color:#eceef1;padding:14px 16px;border-radius:12px;font:14px system-ui,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;gap:12px;align-items:center;flex-wrap:wrap';
                d.innerHTML = '<span>Es ist ein Fehler aufgetreten. Bitte neu laden.<br><small style="color:#9aa1ac">' + String(msg || '').replace(/</g, '&lt;').slice(0, 160) + '</small></span>';
                var b = document.createElement('button'); b.textContent = 'Neu laden';
                b.style.cssText = 'background:#e30613;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer';
                b.onclick = function () { location.reload(); }; d.appendChild(b); document.body.appendChild(d);
            };
            document.body ? go() : document.addEventListener('DOMContentLoaded', go);
        }
    </script>
    <link rel="stylesheet" href="assets/css/app.css?v=20261108h">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/config.js?v=20261108h"></script>
    <script src="assets/js/core.js?v=20261108h"></script>
    <style>
        .opp-card { display: flex; flex-direction: column; gap: 10px; padding: 18px; cursor: pointer; transition: border-color .2s, transform .2s; }
        .opp-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
        .opp-card h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .opp-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--surface-3); display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); color: var(--text-muted); flex-shrink: 0; }
        .opp-card .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-muted); }
        .record { display: flex; gap: 6px; }
        .res { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; }
        .res.w { background: var(--success-soft); color: var(--success); } .res.l { background: var(--brand-soft); color: #ff5a63; } .res.d { background: var(--neutral-soft); color: var(--text-muted); }
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
        .note-box h4 { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .note-box .text { font-size: 14px; color: #cfd3d9; white-space: pre-wrap; min-height: 22px; }
        .note-box .textarea { min-height: 110px; }
        .row-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
        .row-item + .row-item { margin-top: 8px; }
        .row-item:hover { background: var(--surface-2); }
        .row-item .m { flex: 1; min-width: 0; }
        .row-item strong { display: block; font-size: 14px; }
        .row-item small { font-size: 12.5px; color: var(--text-muted); }
        .score { font-family: var(--font-display); font-weight: 800; font-size: 18px; white-space: nowrap; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<main class="page">
    <!-- Übersicht -->
    <div id="view-list">
        <div class="page-head">
            <div>
                <div class="eyebrow" id="eyebrow">Scouting</div>
                <h1>Gegner</h1>
                <p>Spielvorbereitung: Stärken, Schwächen, Spiele, Clips und Taktik gegen jeden Gegner.</p>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap">
                <select class="select" id="season" style="width:auto"></select>
                <button class="btn btn-primary admin-only hidden" onclick="addOpponent()" id="btn-add"></button>
            </div>
        </div>
        <div id="opp-grid" class="grid"></div>
    </div>

    <!-- Detail -->
    <div id="view-detail" class="hidden">
        <div class="page-head">
            <div>
                <a href="opponents.html" class="btn btn-ghost btn-sm" style="margin-left:-12px; margin-bottom:8px" id="back"></a>
                <h1 id="opp-name"></h1>
                <p id="opp-sub"></p>
            </div>
            <div style="display:flex; gap:8px" class="admin-only hidden">
                <button class="btn" onclick="editNotes()" id="btn-edit"></button>
                <button class="btn btn-ghost btn-danger" onclick="deleteOpponent()" id="btn-del"></button>
            </div>
        </div>

        <section class="section">
            <div class="section-head"><h2>Scouting-Bericht</h2></div>
            <div class="card"><div class="card-body">
                <div class="notes-grid" id="notes"></div>
                <div style="display:flex; gap:8px; margin-top:16px" class="hidden" id="notes-actions">
                    <button class="btn" onclick="renderNotes(false)">Abbrechen</button>
                    <button class="btn btn-primary" onclick="saveNotes()" id="btn-save-notes"></button>
                </div>
            </div></div>
        </section>

        <div class="two-col section">
            <section>
                <div class="section-head"><h2>Spiele <span class="count" id="games-count">0</span></h2></div>
                <div id="opp-games"></div>
            </section>
            <section>
                <div class="section-head"><h2>Taktik gegen diesen Gegner <span class="count" id="boards-count">0</span></h2>
                    <a class="btn btn-sm admin-only hidden" id="btn-new-board"></a></div>
                <div id="opp-boards"></div>
            </section>
        </div>

        <section class="section">
            <div class="section-head"><h2>Clips <span class="count" id="clips-count">0</span></h2></div>
            <div id="opp-clips"></div>
        </section>
    </div>
</main>

<script>
    const F = Falcons, I = F.icon, $ = id => document.getElementById(id);
    const user = F.requireUser();
    F.mountShell('opponents');

    const NOTE_FIELDS = [
        { key: 'strengths', label: 'Stärken', icon: 'zap', hint: 'z. B. schnelles Umschaltspiel, starker Torhüter' },
        { key: 'weaknesses', label: 'Schwächen', icon: 'alert', hint: 'z. B. anfällig bei hohem Pressing' },
        { key: 'keyPlayers', label: 'Schlüsselspieler', icon: 'users', hint: 'z. B. #9 Spielmacher, Linksschütze' },
        { key: 'plan', label: 'Unser Plan', icon: 'target', hint: 'Spielvorbereitung: Aufstellung, Taktik, Fokus' }
    ];
    let admin = false, opponents = [], games = [], current = null, season = '';
    $('btn-add').innerHTML = I('plus', 'icon-sm') + ' Gegner anlegen';
    $('back').innerHTML = I('arrowLeft', 'icon-sm') + ' Alle Gegner';
    $('btn-edit').innerHTML = I('pen', 'icon-sm') + ' Bericht bearbeiten';
    $('btn-del').innerHTML = I('trash', 'icon-sm');
    $('btn-save-notes').innerHTML = I('save', 'icon-sm') + ' Speichern';
    $('btn-new-board').innerHTML = I('plus', 'icon-sm') + ' Neues Board';

    async function init() {
        admin = await F.isAdmin();
        $('eyebrow').textContent = `Scouting · ${F.teamName(F.currentTeam())}`;
        const [oSnap, gSnap] = await Promise.all([F.T('opponents').get(), F.T('games').get()]);
        opponents = oSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'de'));
        games = gSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.date).localeCompare(String(a.date)));
        const id = new URLSearchParams(location.search).get('id');
        if (id) return openOpponent(id);
        F.seasonSelect($('season'), games.map(g => g.date), s => { season = s; renderList(); });
    }

    /* ------------------------------------------------------------ Übersicht */
    function resultOf(g) {
        if (g.scoreFor === undefined || g.scoreFor === null || g.scoreFor === '' || g.scoreAgainst === undefined || g.scoreAgainst === '') return null;
        const a = +g.scoreFor, b = +g.scoreAgainst;
        return { a, b, cls: a > b ? 'w' : a < b ? 'l' : 'd', letter: a > b ? 'S' : a < b ? 'N' : 'U' };
    }
    function renderList() {
        if (!opponents.length) {
            $('opp-grid').className = '';
            $('opp-grid').innerHTML = F.empty('Noch keine Gegner', admin ? 'Lege den ersten Gegner an und ordne ihm in der Verwaltung Spiele zu.' : 'Die Coaches haben noch keine Gegner angelegt.', 'shield');
            return;
        }
        $('opp-grid').className = 'grid';
        $('opp-grid').innerHTML = opponents.map(o => {
            const gs = games.filter(g => g.opponentId === o.id && F.inSeason(g.date, season));
            const res = gs.map(resultOf).filter(Boolean);
            const next = games.filter(g => g.opponentId === o.id).map(g => g.date).sort().pop();
            return `<a class="card opp-card" href="opponents.html?id=${o.id}">
                <h3><span class="opp-mark">${F.esc((o.name || '?').slice(0, 2).toUpperCase())}</span>${F.esc(o.name)}</h3>
                <div class="meta"><span>${gs.length} ${gs.length === 1 ? 'Spiel' : 'Spiele'}${season ? ' in ' + season : ''}</span>${next ? `<span>· zuletzt ${F.fmtDate(next)}</span>` : ''}</div>
                ${res.length ? `<div class="record">${res.slice(0, 6).map(r => `<span class="res ${r.cls}" title="${r.a}:${r.b}">${r.letter}</span>`).join('')}</div>` : ''}
                ${o.plan ? `<p class="muted" style="font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden">${F.esc(o.plan)}</p>` : ''}
            </a>`;
        }).join('');
    }

    async function addOpponent() {
        const name = (prompt('Name des Gegners:') || '').trim();
        if (!name) return;
        const ref = await F.T('opponents').add({ name, createdAt: new Date() });
        location.href = 'opponents.html?id=' + ref.id;
    }

    /* --------------------------------------------------------------- Detail */
    async function openOpponent(id) {
        current = opponents.find(o => o.id === id);
        if (!current) { $('view-list').classList.add('hidden'); $('view-detail').classList.remove('hidden'); $('opp-name').textContent = 'Gegner nicht gefunden'; return; }
        $('view-list').classList.add('hidden'); $('view-detail').classList.remove('hidden');
        document.title = `${current.name} · Gegner · Falcons Analyse-Hub`;
        $('opp-name').textContent = current.name;
        $('btn-new-board').href = `tactic.html?opponent=${id}`;
        renderNotes(false);

        const gs = games.filter(g => g.opponentId === id);
        const res = gs.map(resultOf).filter(Boolean);
        const w = res.filter(r => r.cls === 'w').length, l = res.filter(r => r.cls === 'l').length, d = res.length - w - l;
        $('opp-sub').textContent = gs.length ? `${gs.length} ${gs.length === 1 ? 'Spiel' : 'Spiele'}${res.length ? ` · Bilanz ${w} S / ${d} U / ${l} N` : ''}` : 'Noch keine Spiele gegen diesen Gegner zugeordnet.';
        $('games-count').textContent = gs.length;
        $('opp-games').innerHTML = gs.length ? gs.map(g => { const r = resultOf(g); return `<a class="row-item" href="recording_view.html?type=game&id=${g.id}">
                ${I('video', 'icon-sm')}<div class="m"><strong>${F.esc(g.title)}</strong><small>${F.fmtDate(g.date)} · Saison ${F.season(g.date)}</small></div>
                ${r ? `<span class="res ${r.cls}">${r.letter}</span><span class="score">${r.a}:${r.b}</span>` : ''}</a>`; }).join('')
            : F.empty('Keine Spiele', admin ? 'In der Verwaltung → Spiele den Gegner beim Spiel auswählen.' : '', 'video');

        // Boards: Spieler dürfen nur Team-Boards abfragen
        const bq = admin ? F.T('tactics').where('opponentId', '==', id) : F.T('tactics').where('visibility', '==', 'team').where('opponentId', '==', id);
        const [bSnap, media] = await Promise.all([bq.get(), F.loadMedia()]);
        const boards = bSnap.docs.map(x => ({ id: x.id, ...x.data() })).filter(b => b.visibility !== 'private' || b.ownerNr === user.nr);
        $('boards-count').textContent = boards.length;
        $('opp-boards').innerHTML = boards.length ? boards.map(b => `<a class="row-item" href="tactic.html?id=${b.id}">${I('clipboard', 'icon-sm')}<div class="m"><strong>${F.esc(b.title)}</strong><small>${F.esc(b.category || '')} · ${(b.phases || []).length || 1} Phasen</small></div></a>`).join('')
            : F.empty('Keine Boards', admin ? 'Im Taktikboard beim Speichern diesen Gegner auswählen.' : '', 'clipboard');

        const gameIds = new Set(gs.map(g => g.id));
        const clips = media.filter(v => v.opponentId === id || (v.source && gameIds.has(v.source.id)));
        $('clips-count').textContent = clips.length;
        $('opp-clips').className = clips.length ? 'grid' : '';
        F.openClip = cid => location.href = `analyze.html?id=${cid}&type=youtube`;
        $('opp-clips').innerHTML = clips.length ? clips.map(v => F.mediaCard(v)).join('') : F.empty('Keine Clips', 'Clips, die aus Spielen gegen diesen Gegner geschnitten werden, erscheinen hier automatisch.', 'video');
    }

    function renderNotes(editing) {
        $('notes-actions').classList.toggle('hidden', !editing);
        $('notes').innerHTML = NOTE_FIELDS.map(f => `<div class="note-box">
            <h4>${I(f.icon, 'icon-sm')} ${f.label}</h4>
            ${editing ? `<textarea class="textarea" id="note-${f.key}" placeholder="${f.hint}">${F.esc(current[f.key] || '')}</textarea>`
                      : `<div class="text">${current[f.key] ? F.esc(current[f.key]) : '<span class="faint">–</span>'}</div>`}
        </div>`).join('');
    }
    function editNotes() { renderNotes(true); }
    async function saveNotes() {
        const data = {}; NOTE_FIELDS.forEach(f => data[f.key] = $('note-' + f.key).value.trim());
        await F.T('opponents').doc(current.id).update({ ...data, updatedAt: new Date() });
        Object.assign(current, data); renderNotes(false); F.toast('Scouting-Bericht gespeichert');
    }
    async function deleteOpponent() {
        if (await F.deleteDoc('opponents', current.id, `Gegner „${current.name}“ löschen? Spiele und Clips bleiben erhalten.`)) location.href = 'opponents.html';
    }

    F.ready.then(init);
</script>
</body>
</html>
